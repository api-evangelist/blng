apis:
- name: BLNG Journey API
  description: >-
    REST API behind the BLNG Design application that manages design and shopping journeys, the prompts
    submitted against them, uploaded and generated image assets, chat prompts, design plans, and 3D model
    generation and conversion. Supports free-text search over journeys, cursor pagination via nextPageKey,
    and conditional GETs with ETag / If-None-Match. Authenticated with an AWS Cognito access or id token
    as a bearer JWT.
  humanURL: https://journeys.blng.ai/
  baseURL: https://journeys.blng.ai/v2
  tags:
  - Design
  - Generative AI
  - Image Generation
  - 3D Models
  - Jewelry
  properties:
  - type: OpenAPI
    url: openapi/blng-journey-api-openapi.yml
  - type: APIReference
    url: https://journeys.blng.ai/
  - type: Overlay
    url: overlays/blng-journey-api-overlay.yaml
- name: BLNG User API
  description: >-
    REST API that manages BLNG users, roles and permissions, workspaces and workspace members, workspace
    and subscription invitations, organizations, SSO configuration, marketing consent, tooltips, and user
    subscriptions. Also exposes composite operations that create an organization, subscription and user in
    a single call. Authenticated with AWS Cognito user tokens, plus a client-credentials machine token for
    the billing integration.
  humanURL: https://users.blng.ai/
  baseURL: https://users.blng.ai
  tags:
  - Workspaces
  - Users
  - Organizations
  - Subscriptions
  - SSO
  properties:
  - type: OpenAPI
    url: openapi/blng-user-api-openapi.yml
  - type: APIReference
    url: https://users.blng.ai/
  - type: Overlay
    url: overlays/blng-user-api-overlay.yaml
- name: BLNG Billing API
  description: >-
    REST API that manages BLNG payment and billing — listing Stripe products and prices, creating Stripe
    checkout sessions and customer-portal sessions, confirming checkout, and submitting enterprise
    "contact sales" inquiries. Also declares three Stripe webhook receivers for checkout completion and
    subscription update/delete. The product catalog endpoint answers unauthenticated.
  humanURL: https://billing.blng.ai/
  baseURL: https://billing.blng.ai
  tags:
  - Billing
  - Payments
  - Stripe
  - Subscriptions
  properties:
  - type: OpenAPI
    url: openapi/blng-billing-api-openapi.yml
  - type: APIReference
    url: https://billing.blng.ai/
  - type: Overlay
    url: overlays/blng-billing-api-overlay.yaml
