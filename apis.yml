apis:
- name: BLNG User API
  description: >-
    REST API that manages BLNG users, roles and permissions, workspaces and workspace members, workspace
    and subscription invitations, organizations, SSO configuration, marketing consent, tooltips, and user
    subscriptions. Also exposes composite operations that create an organization, subscription and user
    in a single call. Authenticated with AWS Cognito user tokens, plus a client-credentials machine token
    for the billing integration.
  humanURL: https://users.blng.ai/
  baseURL: https://users.blng.ai
  tags:
  - Workspaces
  - User
  - Organization
  - Subscription
  - SSO
  tags_raw:
  - Workspaces
