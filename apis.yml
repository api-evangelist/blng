aid: blng
name: Blng
description: BLNG is an AI-driven creative suite for the jewelry industry, giving jewelers,
  designers, brands, and retailers tools to explore, refine, and present designs fast and
  without compromise. Its Design product turns sketches, doodles, photos, illustrations, or
  text prompts into photorealistic renderings on web and iOS; Studio transforms CAD models
  into market-ready marketing photos and videos at scale; and Retail enables live, made-to-order
  design in-store. BLNG is a Speedinvest portfolio company. BLNG publishes no developer program,
  but the web application is backed by three first-party REST APIs whose OpenAPI definitions are
  served publicly and unauthenticated behind Swagger UI on its own hosts — a Journey API for
  design journeys, prompts, image assets and 3D model generation, a User API for users,
  workspaces, invitations, organizations and subscriptions, and a Billing API for Stripe-backed
  products, checkout and subscription webhooks. All three authenticate with AWS Cognito bearer
  tokens issued at auth.app.blng.ai.
