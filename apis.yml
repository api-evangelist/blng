  - type: APIReference
    url: https://users.blng.ai/
  - type: Overlay
    url: overlays/blng-user-api-overlay.yaml
- name: BLNG Billing API
  description: >-
    REST API that manages BLNG payment and billing — listing Stripe products and prices, creating Stripe
    checkout sessions and customer-portal sessions, confirming checkout, and submitting enterprise "contact
    sales" inquiries. Also declares three Stripe webhook receivers for checkout completion and subscription
    update/delete. The product catalog endpoint answers unauthenticated.
  humanURL: https://billing.blng.ai/
  baseURL: https://billing.blng.ai
  tags:
  - Billing
  - Payments
