standards:
- id: openapi
  conforms: true
  version: 3.0.3 (Journey API), 3.0.1 (User API, Billing API)
  evidence: >-
    Three definitions served publicly and unauthenticated at https://journeys.blng.ai/swagger.yaml,
    https://users.blng.ai/swagger.yaml and https://billing.blng.ai/swagger.yaml, each rendered by
    Swagger UI at the host root. All three parse. 88 operations, 80 schemas.
- id: oauth2
  conforms: true
  evidence: >-
    All three specs declare a `cognitoUserAuth` oauth2 securityScheme with an implicit flow against
    https://auth.app.blng.ai/oauth2/authorize. The User API additionally declares a client_credentials
    machine token against https://auth.app.blng.ai/oauth2/token with scope blng/billing.
  deviation: >-
    The implicit grant is deprecated by OAuth 2.0 Security BCP (RFC 9700) and removed in OAuth 2.1;
    authorization code + PKCE is the current recommendation. The scheme name says "authorization code
    flow" while the declared flow object is `implicit` — the description and the contract disagree.
- id: oidc
  conforms: partial
  evidence: >-
    The `openid` scope is declared and identity is AWS Cognito, which is an OIDC provider. No
    openIdConnect securityScheme is declared, and no OIDC discovery document is served from any
    BLNG-controlled host — see well-known/blng-well-known.yml. Discovery lives on the AWS regional
    issuer (cognito-idp.us-west-2.amazonaws.com), which BLNG does not control.
