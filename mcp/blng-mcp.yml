agent_readiness_blockers:
- No MCP server and no agent card.
- >-
  The only declared OAuth flow is `implicit`, which requires a browser redirect and returns a token in a
  URL fragment — an autonomous agent cannot complete it. There is no authorization-code+PKCE or
  client-credentials path published for third parties.
- No idempotency key on any write, so an agent cannot safely retry a create.
- No rate-limit headers and no Retry-After, so an agent cannot compute a backoff.
- No llms.txt and no /.well-known/ documents on any BLNG host.
