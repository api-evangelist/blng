            - existing_user
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        emailSent:
          type: boolean
          description: Whether the invite email was sent via SES (false if
            EMAIL_API/origin missing or send failed)
        inviteUrl:
          type: string
          format: uri
          description: Canonical accept link (DESIGN_APP_WEB_ORIGIN +
            /workspace-invite/{id}); present when origin is configured so
            clients need not use window.location
    WorkspacePendingInvitationAdmin:
      type: object
      required:
        - workspaceInvitationId
        - workspaceId
        - email
        - role
        - status
        - inviteTarget
        - createdAt
        - updatedAt
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        inviteTarget:
          type: string
          enum:
            - new_user
            - existing_user
        createdAt:
          type: string
        updatedAt:
          type: string
    WorkspaceInvitationPublic:
      type: object
      required:
        - workspaceInvitationId
        - workspaceId
        - emailMasked
        - inviteTarget
        - status
        - role
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        emailMasked:
          type: string
          description: Redacted invitee email for display; use GET .../email-match when
            authenticated to verify the signed-in account
        inviteTarget:
          type: string
          enum:
            - new_user
            - existing_user
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        role:
          type: string
    WorkspaceIntegrityReport:
      type: object
      required:
        - workspaceId
        - workspaceRowExists
        - memberCount
        - ownerCount
      properties:
        workspaceId:
          type: string
          format: uuid
        workspaceRowExists:
          type: boolean
          description: Whether a workspace row exists for this id (false may indicate
            orphaned memberships)
        memberCount:
          type: integer
          minimum: 0
        ownerCount:
          type: integer
          minimum: 0
        subscriptionIdOnWorkspace:
          type: string
          description: Present when the workspace row exists and has subscriptionId set
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    Subscription:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Unique identifier for the subscription
        name:
          type: string
          description: Human-friendly subscription name
        ownerId:
          type: string
          description: id of owner of the subscription
        ownerType:
          type: string
          enum:
            - user
            - organization
          description: Type of owner of the subscription
        subscriptionType:
          type: string
          enum:
            - starter
            - pro
            - team
            - enterprise
            - beta
          description: Type of subscription
        stripeSubscriptionId:
          type: string
          description: Stripe subscription ID
        stripeCustomerId:
          type: string
          description: Stripe customer ID associated with owner
        seatsPurchased:
          type: integer
          description: Number of seats purchased
        paymentSource:
          type: string
          enum:
            - stripe
            - apple
          description: Payment source for subscription. Always stripe for now.
        status:
          type: string
          enum:
            - active
            - canceled
            - incomplete
            - incomplete_expired
            - paused
            - past_due
            - trialing
            - unpaid
          description: Status of subscription. Maps to stripe status.
        cancelAtPeriodEnd:
          type: boolean
          description: Whether the subscription will be canceled at the end of the current
            period
        currentPeriodEnd:
          type: string
          format: date-time
          description: Timestamp of when the current period ends
        billingInterval:
          type: string
          enum:
            - month
            - year
          description: >-
            How often the plan fee is billed. Absent means month. The CU and
            Fast allowance resets monthly on every interval. Annual plans are
            not offered yet.
        termStart:
          type: string
          format: date-time
          description: >-
            Start of the current billing term (moves at each renewal). Monthly
            allowance periods count from allowanceAnchor when it is set, and
            from termStart only when it is not.
        allowanceAnchor:
          type: string
          format: date-time
          description: >-
            Stable instant the monthly allowance periods count from, set once
            per subscription and never moved by a renewal (Stripe
            billing_cycle_anchor, Apple originalPurchaseDate, or the Metronome
            contract start of a new subscribe). Each period is a whole number of
            months from it, clamped to month end per month from the anchor's own
            day. Only read for annual plans.
        termEnd:
          type: string
          format: date-time
          nullable: true
          description: End of the current billing term (renewal). Absent or null for a
            monthly Metronome contract.
        canceledAt:
          type: string
          format: date-time
          description: Timestamp of when the subscription was canceled
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the subscription was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to subscription
    Entitlements:
      type: object
      properties:
        maxJourneys:
          type: integer
          description: Maximum number of journeys allowed on a subscription. -1 for
            unlimited.
        chatVisibilityWindowHrs:
          type: integer
          description: Maximum number of hours to let a user look back in chat history. -1
            for unlimited.
        upscaleAvailable:
          type: boolean
          description: Whether 4k upscale is available on this subscription.
        exportWatermarkRequired:
          type: boolean
          description: >-
            Whether exports from this subscription must carry a visible "Made
            with BLNG" mark. The server computes the policy; whoever hands
            pixels out applies it, which today is the web and iOS clients at
            their export paths. Until the watermark launches (the runtime switch
            /design-app/<stage>/billing/export-watermark-enabled), this is false
            for every tier; once it is on, it is true for the Free tier and
            false for paid plans. An operator override on the subscription
            (entitlementOverrides.exportWatermarkRequired) wins over both.
    Invitation:
      type: object
      properties:
        invitationId:
          type: string
          description: Unique identifier for invitation
        subscriptionId:
          type: string
          description: Unique identifier for the subscription
        inviterId:
          type: string
          description: UserId of inviter
        role:
          type: string
          enum:
            - OWNER
            - BILLING_ADMIN
            - ADMIN
            - EDITOR
            - VIEWER
          description: Role of invitee to be assigned to
        email:
          type: string
          description: Email of invitee
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when invitation was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to invitation
    Organization:
      type: object
      properties:
        organizationId:
          type: string
          description: Unique identifier for the organization
        name:
          type: string
          description: Name of the organization
        stripeCustomerId:
          type: string
          description: Stripe customer ID
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the organization was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to organization
    Tooltip:
      type: object
      properties:
        id:
          type: string
          description: Unique id for the tooltip
        name:
          type: string
          description: Name of the tooltip
        icon:
          type: string
          description: Icon to show next to the title
        title:
          type: string
          description: Title for the tooltip
        description:
          type: string
          description: Contents for the tooltip
    TooltipRegistration:
      type: object
      properties:
        tooltip:
          $ref: '#/components/schemas/Tooltip'
        attachmentPoint:
          type: object
          description: How the tooltip will be attached to the interface for different
            devices
          properties:
            web:
              type: object
              properties:
                dataTooltip:
                  type: string
                  description: data-tooltip attribute that this tooltip will attach to
                side:
                  type: string
                  enum:
                    - top
                    - right
                    - bottom
                    - left
                    - over
                align:
                  type: string
                  enum:
                    - start
                    - center
                    - end
            ios:
              type: object
            ipad:
              type: object
    UserTooltipFlow:
      type: object
      properties:
        id:
          type: string
          description: Unique id for the flow
        name:
          type: string
          description: Name of the flow
        pages:
          type: array
          description: What pages/views the tooltip flow is designed for
          items:
            type: string
        devices:
          type: array
          description: What devices the tooltip flow is designed for
          items:
            type: string
            enum:
              - web
              - ios
              - ipad
        tooltipRegistrations:
          type: array
          items:
            $ref: '#/components/schemas/TooltipRegistration'
        seenByUser:
          type: boolean
          description: Whether this tooltip flow was seen by the user or not
    TooltipResponse:
      type: object
      properties:
        tooltipFlows:
          type: array
          items:
            $ref: '#/components/schemas/UserTooltipFlow'
    GeneralSettings:
      type: object
      description: >-
        The synced general settings, every field named explicitly — there is no
        free-form map, so an unknown key is a 400. Absent booleans default to
        true. Device-local state is deliberately out: the voice input device id
        is a per-device MediaDeviceInfo id and stays in client storage.
        Notification and tutorial state is postponed until a client consumes it,
        and lands as a new member of this document without a data migration.
      additionalProperties: false
      properties:
        smartFocus:
          type: boolean
          default: true
          description: Editor auto-focus behaviour on the comparison view
        snapping:
          type: boolean
          default: true
          description: Whether an object is pulled onto an alignment while dragging
        guideLines:
          type: boolean
          default: true
          description: Whether the alignment overlay is drawn (independent of snapping)
        voiceLanguage:
          type: string
          pattern: '^[A-Za-z0-9-]{2,32}$'
          description: >-
            Voice-dictation language id from the client's catalog ('en-US',
            'zh-Hans', 'yue'). A bounded string rather than a server enum, so a
            newly shipped language does not need a backend deploy. Absent means
            "follow the browser's language".
    UserSettingsWrite:
      type: object
      description: The PUT body. `general` is required, so an empty body cannot
        silently reset settings.
      required:
        - general
      additionalProperties: false
      properties:
        general:
          $ref: '#/components/schemas/GeneralSettings'
    UserSettingsDocument:
      type: object
      description: The settings document as both routes return it; defaults applied
        when never written.
      required:
        - general
        - version
      additionalProperties: false
      properties:
        general:
          $ref: '#/components/schemas/GeneralSettings'
        version:
          type: integer
          minimum: 0
          description: Send back in If-Match on the next PUT; 0 when the user has never
            written settings
        updatedAt:
          type: string
          format: date-time
          description: Absent until the first write
    LibraryItem:
      type: object
      description: >-
        One user library item. Inline kinds (palette, filter, preset) carry
        `payload`; binary kinds (brush, canvas, asset, document) carry an opaque
        journeys `assetId` and optional `thumbnailAssetId`, both uploaded by the
        same user with `scope: 'user'` (readable by the uploader only) before
        the item was created, so an item is usable as soon as it exists.
        `document` is an agent-readable context file (materials sheet, pricing
        PDF, harness/agent config) attached to chat — distinct from `asset`, a
        canvas-droppable image/texture. Journeys enforces ownership of asset ids
        when they are read; design-app does not verify them.
      required:
        - ownerId
        - itemId
        - ownerType
        - kind
        - name
        - version
        - createdAt
        - updatedAt
        - createdBy
      properties:
        ownerId:
          type: string
          description: The owning user's id. (Generic name — a future org library adds
            workspace-owned items.)
        itemId:
          type: string
          description: Public id and per-kind chronological sort key, `kind-uuidv7`
        ownerType:
          type: string
          enum:
            - user
            - workspace
            - space
          description: Always `user` today; workspace/space are reserved for a future
            governed org library
        kind:
          type: string
          enum:
            - brush
            - palette
            - filter
            - preset
            - canvas
            - asset
            - document
        name:
          type: string
          minLength: 1
          maxLength: 120
        payload:
          description: Inline JSON content (non-binary kinds only), serialized size ≤ 64 KiB
        assetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Binary kinds only; opaque id of the user-scoped journeys asset row
            backing the item
          example: 3f3e5fc0-7bca-4a8e-9f0c-8bb1e237d88f
        thumbnailAssetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Binary kinds only; opaque id of a user-scoped journeys asset row
            used as the preview
          example: 90731c7d-6e73-49b0-a72e-b071484e29cb
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency token. Starts at 1 and advances by one on
            every successful write (rename, payload change, asset replacement,
            soft delete). Send it back as `expectedVersion` on PUT; a mismatch
            is 409. Not a content revision.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    EffectPresetCurvePoint:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
          description: Finite normalized coordinate; adjacent x values ascend by at least
            1/255.
        y:
          type: number
          minimum: 0
          maximum: 1
          description: Finite normalized coordinate.
    EffectPresetParameterValue:
      description: >-
        A finite bounded number, boolean, or curve with 2–16 normalized points.
        The backend requires the exact parameter names, value types, and numeric
        ranges defined for each of the 34 effect types; unknown parameters are
        rejected.
      oneOf:
        - type: number
          description: Finite number within the range defined by its effect parameter.
        - type: boolean
        - type: array
          minItems: 2
          maxItems: 16
          items:
            $ref: '#/components/schemas/EffectPresetCurvePoint'
    EffectPresetEffect:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - enabled
        - params
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
            - brightnessContrast
            - levels
            - curves
            - exposure
            - shadowsHighlights
            - clarity
            - vignette
            - whiteBalance
            - hueSaturation
            - vibrance
            - colorBalance
            - splitTone
            - blackWhite
            - posterize
            - threshold
            - invert
            - gaussianBlur
            - motionBlur
            - boxBlur
            - zoomBlur
            - tiltShift
            - twirl
            - bulge
            - wave
            - addNoise
            - median
            - mosaic
            - halftone
            - crystallize
            - sharpen
            - unsharpMask
            - emboss
            - findEdges
            - solarize
        enabled:
          type: boolean
        params:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EffectPresetParameterValue'
          description: >-
            Strict per-effect parameter object. Exact required names and ranges
            are enforced by the backend's EffectPresetPayloadV1 validator; this
            generic map avoids duplicating the discriminated 34-branch schema in
            this OpenAPI file.
        intensity:
          type: number
          minimum: 0
          maximum: 1
          description: Optional finite effect intensity.
    EffectPresetPayloadV1:
      type: object
      additionalProperties: false
      description: >-
        Strict version-1 preset payload. Applies conditionally when kind is
        preset on create, and whenever the stored item kind is preset on update;
        other inline kinds remain opaque JSON. It contains no masks or nested
        presets. Every numeric value is finite, every effect uses the exact
        parameter names/types/ranges defined by the backend, and levels
        black/white bounds must remain valid.
      required:
        - schemaVersion
        - effects
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        effects:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EffectPresetEffect'
    LibraryItemPage:
      type: object
      description: One full page of library items plus the active matching count and
        snapshot version.
      required:
        - items
        - totalCount
        - collectionVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryItem'
        totalCount:
          type: integer
          minimum: 0
          description: Active items for the selected kind, or all kinds when the request
            is unfiltered
        collectionVersion:
          type: integer
          minimum: 0
          description: Non-negative collection snapshot version used to build this page
            and its ETag.
        nextToken:
          type: string
          description: Present when more pages exist; pass as the nextToken query parameter
    LibraryItemCreateRequest:
      type: object
      description: >-
        Inline kinds require `payload` and forbid asset ids; binary kinds
        require the `assetId` journeys returned for the already-uploaded file,
        forbid `payload`, and may carry a `thumbnailAssetId`. A mismatch answers
        400. For kind=preset, payload must be an EffectPresetPayloadV1; palette
        and filter payloads remain generic inline JSON.
      required:
        - clientId
        - kind
        - name
      additionalProperties: false
      properties:
        clientId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Lowercase UUIDv7 identity generated once by the client and reused
            for retries.
        kind:
          type: string
          enum:
            - brush
            - palette
            - filter
            - preset
            - canvas
            - asset
            - document
        name:
          type: string
          minLength: 1
          maxLength: 120
        payload:
          description: >-
            Inline JSON content (non-binary kinds), serialized size ≤ 64 KiB.
            For kind=preset this must conform to EffectPresetPayloadV1; other
            inline kinds remain opaque JSON.
        assetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Required for binary kinds; the id journeys returned for the
            uploaded user-scoped asset
          example: 3f3e5fc0-7bca-4a8e-9f0c-8bb1e237d88f
        thumbnailAssetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Optional id journeys returned for a separately uploaded user-scoped
            preview asset
          example: 90731c7d-6e73-49b0-a72e-b071484e29cb
    LibraryItemCreateResponse:
      type: object
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/LibraryItem'
    LibraryItemGetResponse:
      type: object
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/LibraryItem'
    LibraryItemUpdateRequest:
      type: object
      description: >-
        expectedVersion is required and must equal the item's current `version`.
        At least one of name / payload / assetId is required. payload is inline
        kinds only; assetId replaces a binary item's content with an asset the
        client has already uploaded to journeys; thumbnailAssetId requires
        assetId. When the stored item kind is preset, a replacement payload must
        conform to EffectPresetPayloadV1; other inline kinds remain opaque JSON.
      required:
        - expectedVersion
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: The `version` the client last read; the write is refused with 409
            if it has moved
        name:
          type: string
          minLength: 1
          maxLength: 120
        payload:
          description: >-
            Replacement inline JSON content, serialized size ≤ 64 KiB. For a
            stored preset, this must conform to EffectPresetPayloadV1; other
            inline kinds remain opaque JSON.
        assetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Id of the already-uploaded user-scoped journeys asset that replaces
            the binary; must differ from the current id
          example: cc6a3f9a-ec2e-446a-a202-17c75a4292f4
        thumbnailAssetId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: Optional replacement preview asset id; valid only with assetId, and
            its absence drops the previous preview
    LibraryItemUpdateResponse:
      type: object
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/LibraryItem'
  securitySchemes:
    cognitoUserAuth:
      type: oauth2
      description: Cognito authorization code flow for users
      flows:
        # Implicit flow is less secure but it allows us to avoid implememinting the post call to obtain
        # the JWT token from the token endpoint
        implicit:
          authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
          scopes:
            email: email
            profile: profile
            openid: openid
            aws.cognito.signin.user.admin: aws.cognito.signin.user.admin
        # This flow does not work directly with Swagger because Cognito's Token URL doesn't have
        # CORS setup and the token request is generated by Swagger's UI
        # authorizationCode:
        #   # Redirect and authorization endpoint: https://docs.aws.amazon.com/cognito/latest/developerguide/authorization-endpoint.html
        #   authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
        #   # Token Issuer endpoint: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
        #   tokenUrl: https://auth.app.blng.ai/oauth2/token
        #   scopes:
        #     email: email
        #     profile: profile
        #     openid: openid
        #     aws.cognito.signin.user.admin:
        #       aws.cognito.signin.user.admin
    # For Machine to Machine tokens
    # cognitoMachineAuth:
    #   type: oauth2
    #   description: Cognito authorization code flow for machine to machine
    #   flows:
    #     # This flow does not work directly with Swagger because Cognito's Token URL doesn't have
    #     # CORS setup and the token request is generated by Swagger's UI
    #     clientCredentials:
    #       tokenUrl: https://auth.app.blng.ai/oauth2/token
    #       scopes:
    #         'blng/billing': billing access
    machineBearerToken:
      type: http
      description: |
        Cognito authorization code flow for billing token, request token with command like `curl -X POST https://auth.app.blng.ai/oauth2/token -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=client_credentials&client_id=7arq76lejqmgq3qc556vr7rupn&client_secret=CLIENT_SECRET&scope=blng/billing"`
      scheme: bearer
      bearerFormat: JWT Access Token
