        - Subscription
      summary: Creates a user, a subscription, and attaches them in one transaction.
        Subscription type is starter.
      deprecated: true
      description: >
        Creates a new user (if not exists) and a new subscription (if not
        exists), and attaches the user to the subscription with the specified
        roles. This is **not strictly REST** because it handles multiple
        resources in one call, but it simplifies our client needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: Unique identifier for the User
                email:
                  type: string
