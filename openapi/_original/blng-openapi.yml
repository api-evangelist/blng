  "/users/{userId}/settings":
    get:
      tags:
        - User Settings
      summary: Get the user's settings document
      description: >-
        Returns the whole settings document plus the `version` used for the
        conditional write. One row per user, one explicitly typed schema, one
        version: defaults are applied for a user who has never written settings,
        so the shape is total and the client can PUT straight back what it read.
        Feature-gated per stage (USER_SETTINGS_LIBRARY_ENABLED, off in prod):
        when the flag is off every settings route answers 403 before touching
        data. Tooltip watched-state is NOT part of this document — it stays on
        the user record (tooltipFlowIdsViewed) and its existing /tooltips
        routes.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsDocument'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - User Settings
      summary: Replace the user's settings document
      description: >-
        Idempotent full replacement of the whole document — the client sends
        every field it wants persisted, so a change on one device is one write
        and one conflict rather than several interleaving section writes. Send
        the `version` from GET in `If-Match` (0 when the user has never written
        settings); a stale cross-tab or cross-device write answers 409. The body
        is strictly typed: a key this API does not name is a 400, not a silently
        stored attribute.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
        - name: If-Match
          in: header
          required: true
          description: >-
            Non-negative document version from GET settings (0 when unwritten).
            Sent bare or as a quoted entity tag; anything else is a 400, an
            empty header included. Typed as a string rather than an integer so a
            generated client is not made to reject the quoted forms the handler
            accepts.
          schema:
            type: string
            pattern: '^(?:\d{1,15}|"\d{1,15}"|W/"\d{1,15}")$'
            example: '4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsWrite'
      responses:
        '200':
          description: The stored document, in the same shape GET returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsDocument'
        '400':
          description: Invalid JSON, an unknown key, or a body that fails the schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The document changed after the supplied version was read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  "/users/{userId}/library":
    get:
      tags:
        - User Library
      summary: List the user's library items (paginated)
      description: >-
        One full page of the caller's non-deleted library items. A kind-scoped
        page is newest-first by UUIDv7; an unfiltered page follows the full
        `kind-uuidv7` sort key and is therefore grouped by kind. Soft-deleted
        and internal counter rows are drained server-side rather than producing
        false empty pages. `totalCount` is the active count for the selected
        kind (or all kinds when unfiltered), maintained atomically with
        create/delete. `collectionVersion` is a non-negative, monotonically
        increasing snapshot version. The weak, query-scoped `ETag` binds that
        version to `kind`, `limit`, and `nextToken`; a matching `If-None-Match`
        returns 304. On 200, drain every page and restart the snapshot if its
        collectionVersion changes during pagination. Feature-gated per stage
        (USER_SETTINGS_LIBRARY_ENABLED, off in prod).
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - brush
              - palette
              - filter
              - preset
              - canvas
              - asset
              - document
            description: Restrict the page to one kind
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: nextToken
          in: query
          schema:
            type: string
            description: Opaque token from the previous response to fetch the next page
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            Optional weak, query-scoped cache validator from a previous
            response. An invalid validator is treated as a cache miss.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              schema:
                type: string
              description: Weak validator for this exact kind, limit, nextToken, and
                collectionVersion.
            Cache-Control:
              schema:
                type: string
              example: private, no-cache, must-revalidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemPage'
        '304':
          description: The requested page is unchanged; response has no body.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: private, no-cache, must-revalidate
        '400':
          description: Unknown kind, out-of-range limit, or an invalid or expired nextToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The collection changed repeatedly while reading; retry the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - User Library
      summary: Create a library item
      description: >-
        Inline kinds (palette, filter, preset) send their content in `payload`
        (serialized size ≤ 64 KiB). Binary kinds (brush, canvas, asset,
        document) are upload-first: the client first uploads the file to
        journeys `POST /v2/design/assets/upload` with `scope: 'user'` (readable
        by the uploader only) and no journeyId (journeys `type` per kind: asset
        → `image`; brush, canvas and document → `document`, which accepts pdf,
        txt, md, csv, json, canvas json, zip and octet-stream), then creates
        this item with the returned id as `assetId` (plus an optional
        `thumbnailAssetId` for a separately uploaded preview) in one call. The
        item is usable immediately; there is no pending state and no completion
        step. `assetId` is an opaque reference to a journeys asset row owned by
        the same user: design-app never calls journeys and never verifies it,
        and journeys enforces ownership when the asset is read. Per-kind item
        quotas apply atomically (stage-configured, default 500). `clientId` is a
        required lowercase UUIDv7 idempotency identity. Reuse the same value for
        retries: a new item returns 201, while a replay returns 200 and the
        existing item. The stored id is `${kind}-${clientId}`, so a replay is
        matched on `kind` and `clientId` together and never on the body: sending
        a `clientId` already used for that kind answers 200 with the stored row
        and changes nothing, while reusing one `clientId` under two kinds
        creates two separate items. Mint a fresh `clientId` per item and use
        `PUT` to edit one that exists. A deleted or malformed colliding identity
        returns 409. This required field is an intentional pre-rollout contract
        change because the feature is disabled and has no current frontend
        consumer.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryItemCreateRequest'
      responses:
        '201':
          description: The created catalogue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemCreateResponse'
        '200':
          description: Idempotent replay of an already-created item for the supplied
            clientId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemCreateResponse'
        '400':
          description: Invalid JSON, schema failure, or content fields that do not match
            the kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Per-kind quota, identity collision, or transient concurrent-write
            conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Inline payload over 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  "/users/{userId}/library/{itemId}":
    get:
      tags:
        - User Library
      summary: Get one library item
      description: >-
        The catalogue item row. Binary kinds expose the opaque journeys
        `assetId` and optional `thumbnailAssetId`; the client reads the asset
        through journeys, which enforces ownership. No download or upload URL is
        generated by design-app. Soft-deleted items answer 404.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            description: Library item id (`kind-uuid`)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemGetResponse'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found (or soft-deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - User Library
      summary: Conditionally update an item
      description: >-
        Requires `expectedVersion`, preventing stale writes. Renames any kind;
        `payload` replacement is inline kinds only. A binary kind is replaced by
        uploading the new file to journeys first and sending its id as a new
        `assetId` under the same public itemId; `thumbnailAssetId` may accompany
        it, and without one the previous preview is dropped. The previous
        journeys asset row is left as it is. `version` advances on every
        successful write, rename included, so the response carries the value the
        next PUT must send. The inline payload cap (64 KiB serialized) applies
        as at create time.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            description: Library item id (`kind-uuid`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryItemUpdateRequest'
      responses:
        '200':
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemUpdateResponse'
        '400':
          description: Invalid JSON, schema failure, or a payload sent for a binary kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found (or soft-deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale expectedVersion, or a transient concurrent-write conflict;
            retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Replacement inline payload over 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - User Library
      summary: Delete a library item (soft delete)
      description: >-
        Marks the item deleted; it disappears from lists and reads, stops
        counting against the quota, and its `version` advances like any other
        write. Hard purge of the catalogue row is a follow-up; the journeys
        asset row behind a binary item is left as it is. Deleting an
        already-deleted item answers 404; a per-kind counter that refuses to
        decrement answers 409.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User (must be the caller)
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            description: Library item id (`kind-uuid`)
      responses:
        '204':
          description: Deleted
        '403':
          description: Feature disabled for this environment, or caller is not the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found (or already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The per-kind active counter is out of step with the row, or a
            transient concurrent-write conflict; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
