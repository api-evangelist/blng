openapi: 3.0.1
info:
  title: User Api
  description: Api to manage roles and permissions of users
  version: 1.0.0
paths:
  "/users/{userId}":
    get:
      tags:
        - User
      summary: get user
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
        '404':
          description: User not found
        '500':
          description: Internal Server Error
    put:
      tags:
        - User
      summary: Update user
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: updated_email@example.com
                tooltipFlowIdViewed: onboarding-flow-id-1
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >-
            Bad Request. Also returned with `{"message": "This name is
            reserved"}` when firstName, lastName or the combined name matches
            one of the assistant's names (BLNG, BLNG AI, BLNG · AI, BLNG
            Assistant, BLNG AI Assistant, BLNG Bot). Names are compared after
            NFKD with combining marks removed, ignoring case, spacing,
            punctuation and invisible characters, with look-alike letters from
            other scripts (Cyrillic, Greek, Cherokee, Lisu, small capitals) read
            as their Latin counterparts and strokes such as l, 1 and | read as
            either l or I (Latin capital I always reads as I). Direction marks
            (U+200E, U+200F, U+061C) are ignored, and the words they separate
            are also checked in reverse order. Any name containing a
            text-direction override, embedding or isolate (U+202A-202E,
            U+2066-2069) is refused.
        '404':
          description: User not found
        '409':
          description: >-
            Conflict, `{"message": "The profile changed while saving; please
            retry"}`. The name was changed by another request while this one was
            being checked, and the retries ran out. Retrying the request is
            safe.
        '500':
          description: Internal Server Error
  "/users/{userId}/subscriptions":
    get:
      tags:
        - User Subscription
      summary: Get subscriptions associated with user
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubscriptionListItem'
        '400':
          description: Bad Request
        '404':
          description: User not found
        '500':
          description: Internal Server Error
    post:
      tags:
        - User Subscription
      summary: Associate a subscription with a user
      deprecated: true
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: Unique identifier for the User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - subscriptionId
                - roles
              example:
                subscriptionId: f39b8a30-b917-4eab-87c9-0df3cdf0e93e
                roles:
                  - OWNER
      responses:
        '201':
          description: Subscription linked for user
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Subscription'
        '400':
          description: Bad Request
        '404':
          description: User or subscription not found (if applicable)
        '409':
          description: Conflict (e.g. subscription already linked)
        '500':
          description: Internal Server Error
  "/users/{userId}/memberships":
    get:
      tags:
        - Workspace
      summary: List workspace memberships for user (multi-tenancy; returns [] when
        feature off)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success (empty array when multi-tenancy is disabled for the stage)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMembership'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces":
    get:
      tags:
        - Workspace
      summary: List workspaces for user (summaries for switcher; returns [] when
        feature off)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success (empty array when multi-tenancy is disabled for the stage)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '500':
          description: Internal Server Error
    post:
      tags:
        - Workspace
      summary: Create a team or enterprise workspace (creator becomes owner)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Multi-tenancy disabled, deleted account, insufficient access to
            parent enterprise, or workspace creation limit reached (soft cap on
            memberships with role owner; configurable per stage and per user via
            `allowedWorkspaces` on the User record).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or parent workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}":
    get:
      tags:
        - Workspace
      summary: Get a single workspace (for user) by workspaceId
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
    put:
      tags:
        - Workspace
      summary: Update editable workspace settings fields (name, picture); OWNER/ADMIN
        only
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Multi-tenancy disabled, insufficient role for update,
            allowGuestCompanySkills set to true on a workspace that is not
            Enterprise, or allowGuestCompanySkills sent by an external member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user (or workspace row missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            allowGuestCompanySkills was sent and another request changed its
            stored value between the read and the write, or turning it on found
            the workspace no longer Enterprise. Nothing was written; read the
            settings again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}/members":
    get:
      tags:
        - Workspace
      summary: List members for a workspace visible to the requesting user (paginated)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: nextToken
          in: query
          required: false
          description: Opaque token from the previous response to fetch the next page
          schema:
            type: string
      responses:
        '200':
          description: >-
            Success (members empty when multi-tenancy is disabled for the
            stage). `email` and `displayName` use denormalized fields on
            membership when present to avoid per-page Users BatchGet; legacy
            rows without those fields are hydrated from Users for that page
            only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembersList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}/invitations":
    get:
      tags:
        - Workspace
      summary: List pending workspace invitations (owner/admin)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending invitations for the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspacePendingInvitationAdmin'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
    post:
      tags:
        - Workspace
      summary: Invite a member by email (team, enterprise only; owner/admin; only
        owners invite OWNER or BILLING_ADMIN; SES when configured)
      description: >-
        Only an OWNER may assign OWNER or BILLING_ADMIN; an ADMIN may assign
        ADMIN, EDITOR and VIEWER (403 otherwise). The requester's role is
        re-checked atomically with the invitation write, so a requester demoted
        or removed mid-request gets the same 403/404 as if the change had landed
        first.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationCreated'
        '400':
          description: Bad Request (e.g. invalid body or cannot invite your own email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, role not assignable by
            the requester (an ADMIN inviting OWNER or BILLING_ADMIN), or
            workspace type does not support invitations (personal
            starter/pro/beta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or authenticated user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pending invite exists, user already a member, or the requester's
            membership changed while the request was in flight (retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}/invitations/{invitationId}":
    delete:
      tags:
        - Workspace
      summary: Revoke a pending workspace invitation (owner/admin)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation revoked
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invitation is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}/invitations/{invitationId}/resend":
    post:
      tags:
        - Workspace
      summary: Resend workspace invite email (team/ent workspaces only; owner/admin;
        SES)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resend attempted
          content:
            application/json:
              schema:
                type: object
                required:
                  - emailSent
                properties:
                  emailSent:
                    type: boolean
                    description: Whether SES accepted the send (false if misconfigured or SES
                      failure)
        '400':
          description: Bad Request (e.g. invitation not pending, expired, or
            DESIGN_APP_WEB_ORIGIN missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, or workspace type does
            not support invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many resend attempts for this invitation (cooldown between
            successful invitation emails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspace-invitations/inbox":
    get:
      tags:
        - Workspace
      summary: List pending workspace invitations for the signed-in user's email
        (accept from settings without opening the email link)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending invitations the user can accept (non-expired, workspace
            still valid, not already a member)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - workspaceInvitationId
                    - workspaceId
                    - workspaceName
                    - role
                    - createdAt
                  properties:
                    workspaceInvitationId:
                      type: string
                      format: uuid
                    workspaceId:
                      type: string
                      format: uuid
                    workspaceName:
                      type: string
                    role:
                      type: string
                    createdAt:
                      type: string
                    expiresAt:
                      type: integer
                      description: Unix epoch seconds when the invite link expires
        '403':
          description: Multi-tenancy disabled or account not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspace-invitations/{invitationId}/email-match":
    get:
      tags:
        - Workspace
      summary: Check whether the signed-in user's email matches a pending workspace
        invitation; when true, returns workspace display name (public GET does
        not expose the name)
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Match result
          content:
            application/json:
              schema:
                type: object
                required:
                  - matches
                properties:
                  matches:
                    type: boolean
                  workspaceName:
                    type: string
                    description: Present only when matches is true; workspace display name for the
                      invite UI
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Path userId does not match authenticated user or multi-tenancy
            disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User, invitation not found, or invitation not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspace-invitations/{invitationId}/accept":
    post:
      tags:
        - Workspace
      summary: Accept a workspace invitation (authenticated; email must match; target
        must be team/ent workspace)
      description: >-
        The inviter is re-validated at acceptance. The invitation is refused
        (409) when the inviter is no longer an active OWNER or ADMIN, or when
        the inviter's current role can no longer grant the invited role. An
        OWNER or BILLING_ADMIN invitation sent by an ADMIN is refused this way;
        an OWNER has to invite again. The inviter check is part of the
        acceptance transaction, so an inviter demoted or removed mid-request
        also gets this 409 rather than a grant.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email mismatch, multi-tenancy disabled, orphaned account, or target
            workspace does not support members (personal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invitation not pending, expired, already a member, invalid role,
            inviter can no longer invite or can no longer grant the invited
            role, or transactional conflict (e.g. accepted concurrently in
            another session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DynamoDB throughput limit; client should retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/workspace-invitations/{invitationId}":
    get:
      tags:
        - Workspace
      summary: Public invitation metadata for the invite landing page (no auth;
        workspace name omitted)
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationPublic'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy is not enabled for this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
  "/users/{userId}/workspaces/{workspaceId}/members/{memberUserId}":
    put:
      tags:
        - Workspace
      summary: Update a member role (owner/admin; only owners assign or change OWNER
        and BILLING_ADMIN)
      description: >-
        Only an OWNER may assign OWNER or BILLING_ADMIN; an ADMIN may assign
        ADMIN, EDITOR and VIEWER (403 otherwise). An ADMIN also cannot change
        the role of a member who is currently OWNER or BILLING_ADMIN. The write
        re-checks the requester's role and the member's current role atomically,
        so a change to either while the request is in flight returns the refusal
        that applies to the new state (403/404/409), not a 200.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRoleRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, or an ADMIN assigning
            OWNER or BILLING_ADMIN or changing an OWNER or BILLING_ADMIN member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or member not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Would remove the last workspace owner, the member is deactivated,
            or a membership changed while the request was in flight (retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Workspace
      summary: Remove a workspace member (owner/admin; only owners remove OWNER and
        BILLING_ADMIN members)
      description: >-
        An ADMIN may remove ADMIN, EDITOR and VIEWER members. Only an OWNER may
        remove an OWNER or BILLING_ADMIN member (403 otherwise). The removal
        re-checks the requester's role and the member's current role atomically,
        so a change to either while the request is in flight returns the refusal
        that applies to the new state.
      security:
        - cognitoUserAuth:
