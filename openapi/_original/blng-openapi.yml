                lastName:
                  type: string
                subscriptionName:
                  type: string
                  description: Subscription name to create or attach
                roles:
                  type: array
                  items:
                    type: string
                  description: Roles to assign to the user in this subscription
              required:
                - userId
                - email
                - subscriptionName
              example:
                userId: 'abc123'
                email: 'test@example.com'
                firstName: 'Jane'
                lastName: 'Doe'
                subscriptionName: 'My Super Subscription'
                roles:
                  - OWNER
      responses:
        '201':
          description: Composite creation succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  subscription:
                    $ref: '#/components/schemas/Subscription'
        '400':
          description: Bad Request
        '409':
          description: Conflict (e.g., user or subscription already exists in a
            conflicting state)
        '500':
          description: Internal Server Error
components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier for the user
        email:
          type: string
          description: Email of the user
        firstName:
          type: string
          description: First name of the user
        lastName:
          type: string
          description: Last name of the user
        companyName:
          type: string
          description: Optional company name (app metadata, not auth)
        profilePictureUrl:
          type: string
          description: Profile image URL (e.g. from federated IdP), synced on login
        stripeCustomerId:
          type: string
          description: Stripe customer ID
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the user was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to user
        welcomeEmailSent:
          type: boolean
          description: Whether the welcome email has been sent
          deprecated: true
        welcomeEmailStatus:
          type: string
          enum:
            - SENT
            - NOT_SENT
            - IN_PROGRESS
          description: Status of the welcome email
        welcomeEmailSentAt:
          type: string
          format: date-time
          description: When the consumer welcome email was actually sent. Server-written
            only, set by a real send (never by a client update, and not for
            federated users, who are created with welcomeEmailStatus SENT
            without an email). Absent for accounts created before Sep 27, 2026.
          readOnly: true
        tooltipFlowIdsViewed:
          type: array
          items:
            type: string
          description: Id of all tooltip flows marked as viewed
        activeWorkspaceId:
          type: string
          format: uuid
          description: Current workspace context (multi-tenancy); set via PUT
            /users/{userId}/active-workspace
        allowedWorkspaces:
          type: integer
          minimum: 1
          description: >-
            Ops-only override (DynamoDB): max workspaces this user may own via
            POST /users/{userId}/workspaces. Omitted on normal users; overrides
            the stage default (typically 3). Not settable via public PUT /users.
        marketingConsent:
          $ref: '#/components/schemas/MarketingConsentReceipt'
        marketingConsentPromptedAt:
          type: string
          format: date-time
          description: >-
            Set when the one-time consent prompt was shown and closed without an
            answer. Suppresses further prompting without recording a choice the
            user never made. Mutually exclusive with marketingConsent. Set via
            PUT /users/{userId}/marketing-consent.
        signUpPending:
          type: boolean
          enum:
            - true
          description: >-
            Present only while an account is still going through sign-up and has
            not resolved the marketing consent ask. Written by account creation,
            cleared by the first consent write, and absent on every row created
            before it was introduced. Not settable via any API.
    MarketingConsentReceipt:
      type: object
      description: >-
        Marketing opt-in receipt (GDPR consent provenance). Present only for
        users who made an explicit choice; optIn records that choice either way.
        Synced to HubSpot as the marketing_opt_in contact property. Absent for
        users who have never been asked or who dismissed the prompt.
      required:
        - optIn
        - timestamp
        - wordingVersion
        - captureLocation
      properties:
        optIn:
          type: boolean
          description: The user's choice
        timestamp:
          type: string
          format: date-time
          description: When the choice was captured. Server-stamped; never accepted from
            the caller.
        wordingVersion:
          type: string
          description: Version tag of the exact consent wording shown, so the receipt
            survives copy changes
        captureLocation:
          type: string
          description: >-
            Which surface captured the choice. `email-unsubscribe` and
            `email-spam-complaint` are withdrawals the recipient made against
            mail we sent, the first through an unsubscribe link and the second
            by reporting it to their provider. Both are recorded from the CRM's
            own subscription-change events rather than through this API.
          enum:
            - signup
            - first-login-prompt
            - settings
            - contact-sales
            - email-unsubscribe
            - email-spam-complaint
    MarketingConsentState:
      type: object
      required:
        - optIn
        - shouldPrompt
      properties:
        optIn:
          type: boolean
          nullable: true
          description: The user's recorded choice, or null when they have never answered
        shouldPrompt:
          type: boolean
          description: Whether the one-time consent prompt is due for this user
        deliverable:
          type: object
          description: >-
            The two gates HubSpot applies before delivering a marketing email,
            both of which must pass. Read live from the CRM, so this describes
            the mail rather than the recorded choice. Served only when asked for
            via `include=deliverable`.
          required:
            - marketingContact
            - subscribed
          properties:
            marketingContact:
              type: boolean
              nullable: true
              description: >-
                Whether the contact is a marketing contact. Null when it could
                not be read, which is not the same as false.
            subscribed:
              type: boolean
              nullable: true
              description: >-
                Whether the contact is subscribed to the marketing subscription.
                Null when it could not be read, which is not the same as false.
    PutMarketingConsentRequest:
      oneOf:
        - type: object
          description: An explicit choice
          required:
            - optIn
            - wordingVersion
            - captureLocation
          additionalProperties: false
          properties:
            optIn:
              type: boolean
            wordingVersion:
              type: string
              enum:
                - v1
                - v2
                - v3
            captureLocation:
              type: string
              enum:
                - first-login-prompt
                - settings
                - contact-sales
        - type: object
          description: The prompt was shown and closed without an answer
          required:
            - dismissed
          additionalProperties: false
          properties:
            dismissed:
              type: boolean
              enum:
                - true
    WorkspaceMembership:
      type: object
      description: Membership row (PK userId, SK workspaceId). Returned by GET
        /users/{userId}/memberships.
      required:
        - userId
        - workspaceId
        - role
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
        workspaceId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
            - BILLING_ADMIN
            - ADMIN
            - EDITOR
            - VIEWER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberType:
          type: string
          enum:
            - sso_employee
            - external
            - federated_b2b2c
          description: Optional; SSO / external / federated classification
        federatedIdpId:
          type: string
          description: Optional; IdP identifier when memberType is federated_b2b2c
        email:
          type: string
          description: Optional; from Users table when returned by GET
            .../workspaces/{workspaceId}/members
        displayName:
          type: string
          description: Optional; derived from user first/last name when available
    WorkspaceMembersList:
      type: object
      required:
        - members
      description: Paginated list from GET .../workspaces/{workspaceId}/members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMembership'
        nextToken:
          type: string
          description: Present when more pages exist; pass as the nextToken query parameter
    UserWorkspaceSwitcherItem:
      type: object
      description: >-
        Per-membership workspace summary for the UI switcher. Returned by GET
        /users/{userId}/workspaces. Hydrated fields (name, type, etc.) may be
        omitted if the workspace row is missing.
      required:
        - workspaceId
        - role
        - workspacePolicies
      properties:
        workspaceId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OWNER
            - BILLING_ADMIN
            - ADMIN
            - EDITOR
            - VIEWER
        memberType:
          type: string
          enum:
            - sso_employee
            - external
            - federated_b2b2c
        federatedIdpId:
          type: string
        name:
          type: string
          description: Workspace display name when the workspace record was found
        picture:
          type: string
          format: uuid
          description: Workspace photo asset id; absent until an owner/admin sets one
        type:
          type: string
          enum:
            - starter
            - pro
            - team
            - enterprise
            - beta
            - enterprise-team
        subscriptionId:
          type: string
          format: uuid
        subscriptionType:
          type: string
          description: Billing tier of the workspace's subscription, so the client can
            reflect the active workspace's plan.
          enum:
            - starter
            - pro
            - team
            - enterprise
            - beta
        subscriptionTypeInForce:
          type: string
          description: >-
            The plan the workspace's subscription puts in force now: a canceled
            or lapsed pro, team or enterprise subscription reads starter, beta
            stays beta. Same rule as the subscriptionType of GET
            /internal/workspaces/{workspaceId}/status. Absent when the
            subscription row was not found or its type is unknown.
          enum:
            - starter
            - pro
            - team
            - enterprise
            - beta
        status:
          type: string
          description: Status of the workspace's subscription. Maps to stripe status.
          enum:
            - active
            - canceled
            - incomplete
            - incomplete_expired
            - paused
            - past_due
            - trialing
            - unpaid
        entitlements:
          allOf:
            - $ref: '#/components/schemas/Entitlements'
          description: >-
            Server-computed entitlements of the workspace's subscription (tier,
            lapse rules and operator overrides applied). Present when the
            subscription row was found. Read this for the active workspace
            instead of re-deriving from subscriptionType.
        parentWorkspaceId:
          type: string
          format: uuid
        workspacePolicies:
          $ref: '#/components/schemas/WorkspacePolicies'
        v3ui:
          type: boolean
          deprecated: true
          description: >-
            Deprecated, read workspacePolicies.v3ui with the workspace type.
            True when workspacePolicies.v3ui is true on an enterprise workspace;
            emitted for one release while clients move to workspacePolicies.
    WorkspacePolicies:
      type: object
      description: >-
        The workspace policies, per-customer restrictions an operator sets in
        the management console, delivered in the same item as entitlements: a
        key is present only once an operator set it, and an empty object means
        nothing is set (or the workspace record was not found). Unknown keys and
        values that are not booleans are dropped. The client applies each
        policy's meaning for an absent key. Not settable through PUT
        /users/{userId}/workspaces/{workspaceId}, which rejects the field.
      properties:
        v3ui:
          type: boolean
          description: >-
            The v3 UI (the enterprise Spaces IA). On only when true on an
            enterprise workspace; absent means off.
        voiceInput:
          type: boolean
          description: >-
            Voice dictation. Off only when false, when the voice gateway refuses
            the dictation socket; absent means on.
    UserSubscriptionListItem:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            roles:
              type: array
              description: User roles on this subscription (legacy model compatibility)
              items:
                type: string
                enum:
                  - OWNER
                  - BILLING_ADMIN
                  - ADMIN
                  - EDITOR
                  - VIEWER
            workspaceId:
              type: string
              format: uuid
              description: Linked workspace id (workspace model compatibility)
    UserSubscriptionView:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            roles:
              type: array
              description: User roles on this subscription (legacy model compatibility)
              items:
                type: string
                enum:
                  - OWNER
                  - BILLING_ADMIN
                  - ADMIN
                  - EDITOR
                  - VIEWER
            workspaceId:
              type: string
              format: uuid
              description: Linked workspace id (workspace model compatibility)
    SetActiveWorkspaceRequest:
      type: object
      required:
        - activeWorkspaceId
      properties:
        activeWorkspaceId:
          type: string
          format: uuid
          nullable: true
          description: Workspace to activate for the user; null clears active workspace.
    CreateWorkspaceRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name for the new workspace
        type:
          type: string
          enum:
            - team
            - enterprise
    UpdateWorkspaceRequest:
      type: object
      description: Partial update; at least one property must be present. Unknown
        properties are rejected.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Workspace display name
        picture:
          type: string
          format: uuid
          nullable: true
          description: >-
            Workspace photo asset id (a UUID from our own asset upload, same as
            the user avatar). URLs and data: URIs are rejected. Send null to
            remove the photo.
        allowGuestCompanySkills:
          type: boolean
          description: >-
            "Let guests use company skills". OWNER/ADMIN only, and never an
            external member (403). Setting it to true needs an Enterprise
            workspace (403 on any other type); false is accepted on any tier so
            a stale value can be cleared. Unlocks company skills for guests
            (external members); never company memory.
    WorkspaceSettingsResponse:
      type: object
      description: >-
        Per-workspace settings read model returned by GET
        /users/{userId}/workspaces/{workspaceId}/settings. One call returns the
        workspace profile, subscription linkage, the caller's own membership,
        and the capabilities derived from it, so a workspace-scoped settings
        surface renders without re-encoding the role matrix client-side.
      required:
        - workspace
        - subscription
        - caller
        - permissions
      properties:
        workspace:
          type: object
          description: >-
            Read from the raw workspace row; any field that is missing or not in
            canonical form (legacy or out-of-band rows) is omitted rather than
            failing the request.
          required:
            - workspaceId
            - allowGuestCompanySkills
          properties:
            workspaceId:
              type: string
              format: uuid
            name:
              type: string
            picture:
              type: string
              format: uuid
              description: Workspace photo asset id; absent until an owner/admin sets one
            type:
              type: string
              enum:
                - starter
                - pro
                - team
                - enterprise
                - beta
                - enterprise-team
            parentWorkspaceId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            allowGuestCompanySkills:
              type: boolean
              description: >-
                Effective "Let guests use company skills": true only on an
                Enterprise workspace whose row stores true; false otherwise,
                including when never set.
        subscription:
          type: object
          properties:
            subscriptionId:
              type: string
              format: uuid
            subscriptionType:
              type: string
              enum:
                - starter
                - pro
                - team
                - enterprise
                - beta
            status:
              type: string
              enum:
                - active
                - canceled
                - incomplete
                - incomplete_expired
                - paused
                - past_due
                - trialing
                - unpaid
        caller:
          type: object
          required:
            - role
          properties:
            role:
              type: string
              enum:
                - OWNER
                - BILLING_ADMIN
                - ADMIN
                - EDITOR
                - VIEWER
            memberType:
              type: string
              enum:
                - sso_employee
                - external
                - federated_b2b2c
            federatedIdpId:
              type: string
        permissions:
          type: object
          description: Capabilities derived server-side from the caller's role on this
            workspace.
          required:
            - canEditWorkspaceProfile
            - canManageMembers
            - canManageBilling
            - canManageSso
            - canManageGuestCompanySkills
          properties:
            canEditWorkspaceProfile:
              type: boolean
              description: Rename / photo (OWNER, ADMIN)
            canManageMembers:
              type: boolean
              description: Invite, change roles, remove members (OWNER, ADMIN)
            canManageBilling:
              type: boolean
              description: Plan / payment mutations (OWNER, BILLING_ADMIN)
            canManageSso:
              type: boolean
              description: Rotate SAML config (OWNER/ADMIN on a federated workspace)
            canManageGuestCompanySkills:
              type: boolean
              description: >-
                Toggle allowGuestCompanySkills (OWNER/ADMIN, never an external
                member) on an Enterprise workspace, or turn off a stale true on
                a workspace that left Enterprise
    UpdateMembershipRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: OWNER and BILLING_ADMIN are owner-only; an ADMIN requester may set
            ADMIN, EDITOR or VIEWER.
          enum:
            - OWNER
            - BILLING_ADMIN
            - ADMIN
            - EDITOR
            - VIEWER
    CreateWorkspaceInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          description: OWNER and BILLING_ADMIN are owner-only; an ADMIN inviter may invite
            ADMIN, EDITOR or VIEWER.
          enum:
            - OWNER
            - BILLING_ADMIN
            - ADMIN
            - EDITOR
            - VIEWER
    WorkspaceInvitationCreated:
      type: object
      required:
        - workspaceInvitationId
        - workspaceId
        - email
        - inviteTarget
        - role
        - status
        - createdAt
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
        inviteTarget:
          type: string
          enum:
