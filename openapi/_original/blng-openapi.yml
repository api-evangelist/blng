        - Organization
        - Subscription
        - User
      summary: Creates an organization, a subscription, and a user, and attaches them
        in one transaction
      deprecated: true
      description: >
        Creates a new organization , a new subscription , and attaches an
        existing user to the subscription with an admin role. This is **not
        strictly REST** because it handles multiple resources in one call, but
        it simplifies our client needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationName:
                  type: string
                  description: Name of the organization
                subscriptionName:
                  type: string
                  description: Subscription name to create or attach
                userId:
                  type: string
                  description: Unique identifier for the User
              required:
