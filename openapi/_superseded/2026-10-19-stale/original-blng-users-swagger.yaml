        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        inviteTarget:
          type: string
          enum:
            - new_user
            - existing_user
        createdAt:
          type: string
        updatedAt:
          type: string
    WorkspaceInvitationPublic:
      type: object
