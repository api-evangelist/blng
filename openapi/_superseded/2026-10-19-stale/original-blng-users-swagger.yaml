          description: Unique id for the tooltip
        name:
          type: string
          description: Name of the tooltip
        icon:
          type: string
          description: Icon to show next to the title
        title:
          type: string
          description: Title for the tooltip
        description:
          type: string
          description: Contents for the tooltip
    TooltipRegistration:
      type: object
      properties:
        tooltip:
          $ref: '#/components/schemas/Tooltip'
        attachmentPoint:
          type: object
          description: How the tooltip will be attached to the interface for different
            devices
          properties:
            web:
              type: object
              properties:
                dataTooltip:
                  type: string
                  description: data-tooltip attribute that this tooltip will attach to
                side:
                  type: string
                  enum:
                    - top
                    - right
                    - bottom
                    - left
                    - over
                align:
                  type: string
                  enum:
                    - start
                    - center
                    - end
            ios:
              type: object
            ipad:
              type: object
    UserTooltipFlow:
      type: object
      properties:
        id:
          type: string
          description: Unique id for the flow
        name:
          type: string
          description: Name of the flow
        pages:
          type: array
          description: What pages/views the tooltip flow is designed for
          items:
            type: string
        devices:
          type: array
          description: What devices the tooltip flow is designed for
          items:
            type: string
            enum:
              - web
              - ios
              - ipad
        tooltipRegistrations:
          type: array
          items:
            $ref: '#/components/schemas/TooltipRegistration'
        seenByUser:
          type: boolean
          description: Whether this tooltip flow was seen by the user or not
    TooltipResponse:
      type: object
      properties:
        tooltipFlows:
          type: array
          items:
            $ref: '#/components/schemas/UserTooltipFlow'
  securitySchemes:
    cognitoUserAuth:
      type: oauth2
      description: Cognito authorization code flow for users
      flows:
        # Implicit flow is less secure but it allows us to avoid implememinting the post call to obtain
        # the JWT token from the token endpoint
        implicit:
          authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
          scopes:
            email: email
            profile: profile
            openid: openid
            aws.cognito.signin.user.admin: aws.cognito.signin.user.admin
        # This flow does not work directly with Swagger because Cognito's Token URL doesn't have
        # CORS setup and the token request is generated by Swagger's UI
        # authorizationCode:
        #   # Redirect and authorization endpoint: https://docs.aws.amazon.com/cognito/latest/developerguide/authorization-endpoint.html
        #   authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
        #   # Token Issuer endpoint: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
        #   tokenUrl: https://auth.app.blng.ai/oauth2/token
        #   scopes:
        #     email: email
        #     profile: profile
        #     openid: openid
        #     aws.cognito.signin.user.admin:
        #       aws.cognito.signin.user.admin
    # For Machine to Machine tokens
    # cognitoMachineAuth:
    #   type: oauth2
    #   description: Cognito authorization code flow for machine to machine
    #   flows:
    #     # This flow does not work directly with Swagger because Cognito's Token URL doesn't have
    #     # CORS setup and the token request is generated by Swagger's UI
    #     clientCredentials:
    #       tokenUrl: https://auth.app.blng.ai/oauth2/token
    #       scopes:
    #         'blng/billing': billing access
    machineBearerToken:
      type: http
      description: |
        Cognito authorization code flow for billing token, request token with command like `curl -X POST https://auth.app.blng.ai/oauth2/token -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=client_credentials&client_id=7arq76lejqmgq3qc556vr7rupn&client_secret=CLIENT_SECRET&scope=blng/billing"`
      scheme: bearer
      bearerFormat: JWT Access Token
