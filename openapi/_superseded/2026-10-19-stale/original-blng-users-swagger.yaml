  "/users/{userId}/marketing-consent":
    get:
      tags:
        - User
      summary: Get marketing consent state and whether the one-time prompt is due
      description: >-
        `shouldPrompt` is true only for a live self-serve user who has neither
        answered nor been asked. Users in an enterprise workspace are never
        prompted: BLNG processes them under a customer DPA and has no standing
        to collect marketing consent from them. A user row that does not exist
        yet answers `{ "optIn": null, "shouldPrompt": false }` rather than an
        error.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingConsentState'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - User
      summary: Record a marketing consent choice, or that the prompt was dismissed
      description: >-
        An answer stores a consent receipt on the user record, which the HubSpot
        reconciliation cron syncs to the `marketing_opt_in` contact property. A
        dismissal records only that the prompt was shown, so no property value
        reaches HubSpot and no choice is fabricated; it never overwrites an
        answer. The receipt timestamp is server-stamped and cannot be supplied
        by the caller.
      security:
        - cognitoUserAuth:
            - openid
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMarketingConsentRequest'
      responses:
        '200':
          description: Consent state after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingConsentState'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account deleted, or the user is an enterprise workspace member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
