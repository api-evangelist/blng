        - cognitoUserAuth: []
  /design/journeys/{journeyId}/plans/{planId}:
    get:
      summary: Get a design plan for a journey
      operationId: getDesignPlanForJourney
      tags:
        - Design Journey
        - Plans
      parameters:
        - name: journeyId
          in: path
          required: true
          schema:
            type: string
        - name: planId
          in: path
          required: true
          schema:
            type: string
        - in: header
          name: If-None-Match
          description: |
            If provided, the server returns `304 Not Modified` when the
            plan's current `ETag` matches this value. Use the `ETag`
            returned from a prior GET response as the value here for
            cheap revalidation — plan bodies change frequently while a
            plan is executing and stabilize once `status === complete`.
          required: false
          schema:
            type: string
            example: 'W/"f4e3d2c1b0a90817"'
      responses:
        '200':
          description: Design plan
          headers:
            ETag:
              description: |
                Weak entity tag computed from a truncated SHA-256 hash
                of the serialized plan response. Bumps on every status
                flip, stage update, generated-image addition, or analysis
                edit. Send this value back as `If-None-Match` on
                subsequent GETs.
              schema:
                type: string
                example: 'W/"f4e3d2c1b0a90817"'
            Cache-Control:
              description: |
                Always `private, no-cache, must-revalidate`. Clients may
                cache the body but MUST revalidate with the origin via
                `If-None-Match` before reuse; per-user, so not cacheable
                by shared intermediaries.
              schema:
                type: string
                example: 'private, no-cache, must-revalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignPlanItem'
        '304':
          description: |
            Returned when the request's `If-None-Match` header matches
            the current ETag. Body is empty; clients should reuse their
            cached representation.
          headers:
            ETag:
              description: Current ETag value, identical to the request's `If-None-Match`.
              schema:
                type: string
                example: 'W/"f4e3d2c1b0a90817"'
            Cache-Control:
              description: Always `private, no-cache, must-revalidate`.
              schema:
                type: string
                example: 'private, no-cache, must-revalidate'
        '404':
          description: Journey or plan not found
      security:
        - bearerAuth: []
        - cognitoUserAuth: []
  /design/journeys/{journeyId}/plans:
    get:
      summary: List design plans for a journey (newest first)
      operationId: listDesignPlansForJourney
      tags:
        - Design Journey
        - Plans
      parameters:
        - name: journeyId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: nextPageKey
          in: query
          schema:
            type: string
        - in: header
          name: If-None-Match
          description: |
            If provided, the server returns `304 Not Modified` when the
            response body's current `ETag` matches this value. Bulk-plans
            responses bump their etag whenever any plan in the page
            changes (status flip, stage update, etc.) or when a new plan
            is appended.
          required: false
          schema:
            type: string
            example: 'W/"0123456789abcdef"'
      responses:
        '200':
          description: Design plans
          headers:
            ETag:
              description: |
                Weak entity tag computed from a truncated SHA-256 hash
                of the serialized response body. Different pagination
                cursors produce different etags.
              schema:
                type: string
                example: 'W/"0123456789abcdef"'
            Cache-Control:
              description: |
                Always `private, no-cache, must-revalidate`. Clients may
                cache the body but MUST revalidate with the origin via
                `If-None-Match` before reuse; per-user, so not cacheable
                by shared intermediaries.
              schema:
                type: string
                example: 'private, no-cache, must-revalidate'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DesignPlanItem'
                  nextPageKey:
                    type: string
        '304':
          description: |
            Returned when the request's `If-None-Match` header matches
            the current ETag. Body is empty; clients should reuse their
            cached representation.
          headers:
            ETag:
              description: Current ETag value, identical to the request's `If-None-Match`.
              schema:
                type: string
                example: 'W/"0123456789abcdef"'
            Cache-Control:
              description: Always `private, no-cache, must-revalidate`.
              schema:
                type: string
                example: 'private, no-cache, must-revalidate'
        '404':
          description: Journey not found
      security:
        - bearerAuth: []
        - cognitoUserAuth: []
  /design/journeys/{journeyId}/image-ops:
    post:
      summary: Submit an image operation (upscale, background removal, etc.)
      description: >
        Accepts a request to perform an image operation on a layer or prompt
        asset. The request is validated and forwarded to a FIFO SQS queue for
        asynchronous processing by Design Exec. Returns 202 Accepted
        immediately.
      tags:
        - Design Journey
        - Image Ops
      parameters:
        - name: journeyId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier for the journey.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageOpsRequest'
      responses:
        '202':
          description: Image operation accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageOpsAcceptedResponse'
        '400':
          description: Invalid request (bad schema, unsupported Layer bucket, or Prompt
            asset validation failure)
        '401':
          description: Unauthorized
        '404':
          description: Journey not found
      security:
        - bearerAuth: []
        - cognitoUserAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use your Cognito "access_token" or "id_token" obtained from AWS Cognito Hosted UI 
        or CLI. Click "Authorize" and paste the token.
    cognitoUserAuth:
      type: oauth2
      description: Cognito authorization code flow for users
      flows:
        # Implicit flow is less secure but it allows us to avoid implememinting the post call to obtain
        # the JWT token from the token endpoint
        implicit:
          authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
          scopes:
            email: email
            profile: profile
            openid: openid
            aws.cognito.signin.user.admin: aws.cognito.signin.user.admin
  schemas:
    Journey:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the journey
        userId:
          type: string
          description: Unique identifier for the user
        type:
          type: string
          description: Type of the journey (design or shopping)
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the journey was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to the journey
        images:
          type: array
          items:
            type: string
          description: List of image IDs associated with the journey, this property is
            deprecated and will no longer be returned to clients
          deprecated: true
        specifics:
          $ref: '#/components/schemas/JourneySpecifics'
    JourneySpecifics:
      type: object
      properties:
        height:
          type: number
        historicImages:
          type: array
          deprecated: true
          description: List of image IDs that were generated from prompts, this property
            is deprecated and will be removed in the future
          items:
            type: string
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        name:
          type: string
        preview:
          type: string
        lastGenerateImageId:
          description: asset ID of the last generated image from a chat prompt, updated
            when a chat prompt result is processed
          type: string
        visibleCanvasImageId:
          description: asset ID of what the current canvas looks like (also called
            flattened), updated by clients when saving a layer
          type: string
        sceneImageId:
          description: asset ID of the image used as the scene style in the app
          type: string
        width:
          type: number
        backgroundColor:
          $ref: '#/components/schemas/Color'
        references:
          type: array
          items:
            $ref: '#/components/schemas/AssetReference'
    Layer:
      oneOf:
        - $ref: '#/components/schemas/ImageLayer'
        - $ref: '#/components/schemas/ModelLayer'
        - $ref: '#/components/schemas/LegacyLayer'
      discriminator:
        propertyName: layerType
        mapping:
          image: '#/components/schemas/ImageLayer'
          model: '#/components/schemas/ModelLayer'
    ImageLayer:
      type: object
      required: [ layerType, name, visible, locked, opacity, image ]
      properties:
        layerType:
          type: string
          enum: [ image ]
          description: Discriminator indicating an image (2D) layer.
        name:
          type: string
          description: Name of the layer
        image:
          $ref: '#/components/schemas/LayerImage'
        visible:
          type: boolean
        locked:
          type: boolean
        blendMode:
          type: string
          description: Blending mode for compositing this layer in 2D.
        opacity:
          type: number
        width:
          type: number
        height:
          type: number
        originScale:
          type: string
          enum: [ '1x', '2x', '3x', 'upscale4x', 'external' ]
          description: Deprecated legacy field preserved for compatibility.
          deprecated: true
    ModelLayer:
      type: object
      required: [ layerType, name, visible, locked, opacity, model ]
      properties:
        layerType:
          type: string
          enum: [ model ]
          description: Discriminator indicating a 3D model layer.
        name:
          type: string
        blendMode:
          type: string
        model:
          $ref: '#/components/schemas/LayerModel3D'
        visible:
          type: boolean
        locked:
          type: boolean
        opacity:
          type: number
    LegacyLayer:
      type: object
      deprecated: true
      description: Pre-discriminator layer shape. Accepted verbatim for back-compat;
        no server-side coercion.
      properties:
        name:
          type: string
          description: Name of the layer.
        image:
          $ref: '#/components/schemas/LayerImage'
        visible:
          type: boolean
        locked:
          type: boolean
        blendMode:
          type: string
          description: Blending mode for compositing this layer in 2D.
          example: normal
        opacity:
          type: number
        width:
          type: number
        height:
          type: number
        resolution:
          type: number
          description: Resolution multiplier (legacy).
          deprecated: true
        originScale:
          type: string
          enum: [ '1x', '2x', '3x', 'upscale4x', 'external' ]
          deprecated: true
      required: [ name ]
    LayerImage:
      type: object
      properties:
        id:
          type: string
          description: ID of the layer's image asset
        width:
          type: number
          description: Width of the image
        height:
          type: number
          description: Height of the image
        top:
          type: number
          description: Topmost Y coordinate of the image
        left:
          type: number
          description: Leftmost X coordinate of the image
    LayerModel3D:
      type: object
      required: [ modelId, transform ]
      properties:
        modelId:
          type: string
          description: References a Model3D entity in this journey.
        resolvedAssetId:
          type: string
          readOnly: true
          description: Server-populated convenience pointer to the concrete asset
            currently used for this client/platform.
        transform:
          $ref: '#/components/schemas/Transform3D'
    Transform3D:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/Vector3'
        orientation:
          $ref: '#/components/schemas/Quaternion'
        scale:
          $ref: '#/components/schemas/Vector3'
      required: [ position, rotationDegrees, scale ]
    Vector3:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
      required: [ x, y, z ]
    Quaternion:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
        w: { type: number }
      required: [ x, y, z, w ]
    Image:
      deprecated: true
      description: This schema is deprecated and will be removed in the future. Please
        use the Asset schema instead.
      type: object
      required:
        - imageId
        - journeyId
        - contentType
      properties:
        imageId:
          type: string
          description: Unique identifier for the image.
        journeyId:
          type: string
          description: Identifier of the journey this image is associated with.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the image was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to the image.
        metadata:
          type: object
          properties:
            format:
              type: string
              description: Image format (e.g., JPEG, PNG).
            size:
              type: integer
              description: Image size in bytes.
    # Base Prompt
    Prompt:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the prompt.
        journeyId:
          type: string
          description: Identifier of the journey this prompt is associated with.
        userId:
          type: string
          description: Unique identifier for the user who created the prompt.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the prompt was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to the prompt.
        request:
          $ref: '#/components/schemas/PromptRequest'
        response:
          $ref: '#/components/schemas/PromptResponse'
        scrambled:
          type: boolean
          description: Indicates if the prompt is scrambled because of entitlements.
        activeAt:
          type: number
          description: Unix timestamp in seconds for when the prompt is active (used for
            concurrency limits).
        expiresAt:
          type: number
          description: Unix timestamp in seconds for when the prompt will expire.
        processingState:
          type: string
          enum: [ active, cancelled ]
          description: Pipeline control for design-v3 before a plan id exists; omitted on
            legacy prompts
      required:
        - id
        - journeyId
        - request
    # General Prompt Request Structure
    PromptRequest:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the prompt request. The server will create
            this if not provided.
        type:
          type: string
          description: The type of prompt (e.g., design, design-v2 etc.).
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the prompt was generated.
        userAgent:
          type: string
          description: User agent string of the client that generated the prompt.
      required:
        - type
    PromptRequestV3:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the prompt request. The server will create
            this if not provided.
        type:
          type: string
          description: Must be 'design-v3'.
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the prompt was generated.
        userAgent:
          type: string
          description: User agent string of the client that generated the prompt.
        userMessage:
          type: string
          description: The message from the user to the chat prompt.
        variantCount:
          type: integer
          description: Number of image variants to generate.
      required:
        - type
    # General Prompt Response Structure
    PromptResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the response was generated.
        type:
          type: string
          description: The type of prompt (e.g., design, design-v2 etc.).
    ChatPrompt:
      type: object
      properties:
        promptId:
          type: string
          description: Unique identifier for the chat prompt.
        journeyId:
          type: string
          description: Identifier of the journey this chat prompt is associated with.
        request:
          $ref: '#/components/schemas/ChatPromptRequest'
        response:
          $ref: '#/components/schemas/ChatPromptResponse'
      required:
        - promptId
        - journeyId
        - request
        - response
    ChatPromptRequest:
      allOf:
        - $ref: '#/components/schemas/PromptRequest'
        - type: object
          properties:
            userMessage:
              type: string
            type:
              type: string
              enum:
                - design-v2
            expirationTime:
              type: string
              format: date-time
            usePremiumMode:
              type: boolean
              default: true
            artisticStyle:
              type: string
              default: 'classic'
            variantCount:
              type: integer
              default: 1
            imageDetails:
              $ref: '#/components/schemas/ImageGenPromptDetails'
          required:
            - userMessage
            - type
    ChatPromptRequestV3:
      allOf:
        - $ref: '#/components/schemas/PromptRequest'
        - type: object
          properties:
            userMessage:
              type: string
            # type:
            #   type: string
            #   enum:
            #     - design-v3
            expirationTime:
              type: string
              format: date-time
            variantCount:
              type: integer
              default: 1
            assetDetails:
              $ref: '#/components/schemas/AssetDetails'
            imageDims:
              $ref: '#/components/schemas/ImageDimensions'
            scene:
              oneOf:
                - $ref: '#/components/schemas/Color'
                - preset:
                  type: object
                  properties:
                    preset:
                      type: string
                      description: Name of the preset scene to use for generation (e.g., classic,
                        arctic, aurora, noir, transparent)
                - assetId:
                  type: object
                  properties:
                    assetId:
                      type: string
                      description: The UUID of the image asset
            mode:
              type: string
              enum:
                - auto
                - fast
                - thinking
              description: The mode of image generation (e.g., 'auto', 'fast', 'thinking').
          required:
            - scene
            - expirationTime
            - assetDetails
            - timestamp
            - type
            - mode
            - userAgent
            - userMessage
            - variantCount
    ImageGenPromptDetails:
      type: object
      properties:
        canvasImageId:
          type: string
        isColorImage:
          type: boolean
        influence:
          type: number
          format: float
        lassoMask:
          $ref: '#/components/schemas/LassoMask'
    LassoMask:
      type: object
      description: Details about a lasso mask selection.
      properties:
        lassoMaskId:
          type: string
        auxiliarySketchId:
          type: string
      required:
        - lassoMaskId
    AssetDetails:
      type: object
      properties:
        lassoMaskId:
          type: string
        isColorAsset:
          type: boolean
        references:
          type: array
          items:
            $ref: '#/components/schemas/AssetReference'
    AssetReference:
      type: object
      properties:
        assetId:
          type: string
        type:
          type: string
          description: Type of the asset reference.
          enum:
            - canvas
            - asset
        influence:
          type: number
          minimum: 0
          maximum: 1
        intent:
          type: array
          description: >-
            Per-image guidance from the reference context menu — aspect chips
            (e.g. texture, color) and/or free text describing how this image
            should influence the generation. Passed through to the design
            pipeline verbatim; sanitized there.
          items:
            type: string
    # Specialized Response for Chat Prompts
    ChatPromptResponse:
      allOf:
        - $ref: '#/components/schemas/PromptResponse'
        - type: object
          properties:
            status:
              type: string
              enum:
                - succeeded
                - failed
                - expired
            botMessage:
              type: string
              description: The AI-generated response to the chat message.
            generatedImageIds:
              type: array
              description: List of asset IDs for images generated as part of the prompt
                result.
              items:
                type: string
    Color:
      type: object
      properties:
        red:
          type: integer
          description: Red component of the color (0-255)
        green:
          type: integer
          description: Green component of the color (0-255)
        blue:
          type: integer
          description: Blue component of the color (0-255)
        alpha:
          type: number
          format: float
          description: Alpha component of the color (0.0-1.0)
    Asset:
      type: object
      required:
        - id
        - type
        - contentType
        - format
      properties:
        id:
          type: string
          description: Unique identifier for the asset
        userId:
          type: string
          description: Unique identifier for the user who owns the asset
        journeyId:
          type: string
          description: Optional journey association for the asset
        type:
          type: string
          enum: [ image, model, stamps, video ]
        contentType:
          type: string
          description: MIME type stored on the object (e.g., image/png, model/gltf-binary,
            application/octet-stream)
        format:
          type: string
          description: Normalized format (lowercase, no dot), e.g., png, jpg, gif, glb, usdz
        description:
          type: string
          description: Short human-readable name/description of the asset content (e.g.,
            "Gold ring with diamond solitaire"), provided by generation
            pipelines.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metadata:
          type: object
          description: Opaque, client-safe fields (server populated)
          properties:
            size:
              type: integer
              description: Size in bytes
            hasThumbnail:
              type: boolean
              description: >
                True when a thumbnail/preview still exists for this asset (video
                assets). Fetch it via GET
                /design/assets/{assetId}/download?variant=thumbnail.
    CreateModel3DRequest:
      type: object
      required: [ sourceAssetId ]
      properties:
        sourceAssetId:
          type: string
          description: >
            ID of an uploaded Asset (type=model) that seeds this Model. If
            format ∈ {usd, usdz, glb}, that slot is immediately marked
            succeeded. Other formats (e.g., obj, stl, ply, gltf) are retained as
            source-only attachments. On create, the server automatically
            enqueues conversions for any missing slots.
    Model3DSlot:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ submitted, succeeded, failed, expired ]
          description: Current status of the slot.
        assetId:
          type: string
          description: Asset ID for the slot when status=succeeded.
        lastError:
          type: string
          description: Most recent terminal error (when status=failed).
        expiresAt:
          type: string
          format: date-time
          description: When the slot will be automatically marked expired if not succeeded.
    Model3D:
      type: object
      description: Three-slot 3D model with conversion status per slot.
      required: [ id, journeyId, createdAt, updatedAt, slots, sourceAssetId, status ]
      properties:
        id:
          type: string
        journeyId:
          type: string
        sourceAssetId:
          type: string
          description: Original uploaded/generated asset that seeded this model.
        slots:
          type: object
          required: [ usd, usdz, glb ]
          properties:
            usd: { $ref: '#/components/schemas/Model3DSlot' }
            usdz: { $ref: '#/components/schemas/Model3DSlot' }
            glb: { $ref: '#/components/schemas/Model3DSlot' }
        status:
          type: string
          enum: [ submitted, failed, succeeded ]
          description: |
            Aggregated readiness derived from slots:
            - submitted: at least one slot submitted and none failed
            - failed: all terminal and at least one failed
            - succeeded: all terminal and all succeeded
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmitModelConversionsRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: If true, enqueue even if a slot is succeeded.
    ModelGenerationRequest:
      description: |
        Request payload for generating a model from an image. Model generations first create a GLB, then the system automatically enqueues conversions to USD and USDZ.
        Use `imageSource: "layer"` when `imageAssetId` is a journey canvas image that is not necessarily listed on the prompt's generated outputs (still requires `promptId` on the same journey for routing).
      type: object
      required:
        - imageAssetId
      properties:
        promptId:
          type: string
          description: ID of the prompt that generated the image asset (optional for
            standalone generations)
        imageAssetId:
          type: string
          description: ID of the image asset to be used in the model generation
        imageSource:
          type: string
          enum: [ prompt, layer ]
          default: prompt
          description: |
            `prompt` (default): `imageAssetId` must be one of this prompt's generated image asset IDs.
            `layer`: `imageAssetId` may be any image asset on the journey (e.g. canvas layer composite); ownership and journey checks still apply.
        expirationTime:
          type: string
          format: date-time
          description: Timestamp when the model generation request expires
          readOnly: true
    ModelGenerationSuccessResponse:
      type: object
      required:
        - ok
        - generationId
        - imageAssetId
        - modelId
        - glbAssetId
      properties:
        ok:
          type: boolean
          enum: [ true ]
        generationId:
          type: string
        imageAssetId:
          type: string
        modelId:
          type: string
          description: The Model3D created from the generation output.
        glbAssetId:
          type: string
          description: The GLB asset produced by the generation step.
    ModelGenerationErrorResponse:
      type: object
      required:
        - ok
        - generationId
        - imageAssetId
        - error
      properties:
        ok:
          type: boolean
          enum: [ false ]
        generationId:
          type: string
        imageAssetId:
          type: string
        error:
          type: string
          description: Error message describing the failure reason.
    ModelGenerationResponse:
      oneOf:
        - $ref: '#/components/schemas/ModelGenerationSuccessResponse'
        - $ref: '#/components/schemas/ModelGenerationErrorResponse'
      description: Terminal payload for a model generation (success or error)
    ModelGeneration:
      description: End-to-end pipeline - generation (GLB) → slot conversions (USD,
        USDZ) → ready
      type: object
      required:
        - generationId
        - journeyId
        - status
        - request
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        journeyId:
          type: string
        promptId:
          type: string
        status:
          type: string
          enum:
            - submitted
            - generating # 2D→GLB model generation running
            - converting # GLB done; conversions to usdz/usd in progress
            - succeeded # all required slots (usd/usdz/glb) succeeded
            - failedGeneration # generation step failed
            - failedConversion # one or more conversions failed
            - expired # generation job expired or never returned from 3d service
        # Present once generation step returns GLB and the Model3D is created
        modelId:
          type: string
          description: ID of the created Model3D (available from 'converting' onward).
        # Present once generation step returns success and the GLB asset is created
        glbAssetId:
          type: string
          description: Asset ID of the GLB slot produced by generation (available from
            'converting' onward).
        request:
          $ref: '#/components/schemas/ModelGenerationRequest'
        response:
          $ref: '#/components/schemas/ModelGenerationResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DesignPlanItem:
      type: object
      required:
        - planId
        - journeyId
        - promptId
        - status
        - planThoughtReasoning
        - planProposal
        - planDeclaration
        - stages
      properties:
        planId:
          type: string
        journeyId:
          type: string
        promptId:
          type: string
        status:
          type: string
          enum: [ draft, review, complete, failed ]
        planThoughtReasoning:
          type: array
          description: The thought process and reasoning behind the design plan.
          items:
            type: string
        planProposal:
          type: string
        planDeclaration:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/DesignPlanStage'
    DesignPlanStage:
      type: object
      required:
        - stageId
        - status
        - generatedImages
        - executionUpdate
        - resultAnalysis
      properties:
        stageId:
          type: string
        generatedImages:
          type: array
          items:
            $ref: '#/components/schemas/DesignPlanGeneratedImages'
        executionUpdate:
          type: string
        resultAnalysis:
          type: string
        status:
          type: string
          enum: [ draft, review, complete, failed ]
    DesignPlanGeneratedImages:
      type: object
      required:
        - assetId
      properties:
        assetId:
          type: string
    ImageDimensions:
      type: object
      properties:
        width:
          type: number
        height:
          type: number
    ImageOpsApiWorkflow:
      type: string
      enum:
        - Upscale
        - RemoveBackground
        - RegenerateImage
    ImageOpsWorkflow:
      type: string
      enum:
        - Upscale
        - RemoveBackground
        - RegenerateImage
        - GenerateEmbeddings
        - GenerateMasks
    ImageLocation:
      type: object
      required:
        - s3Bucket
        - s3Key
      properties:
        s3Bucket:
          type: string
        s3Key:
          type: string
    ImageOpsRequestBase:
      type: object
      description: Common fields for POST /design/journeys/{journeyId}/image-ops (see
        `ImageOpsRequest` oneOf).
      required:
        - workflow
        - journeyId
      properties:
        workflow:
          $ref: '#/components/schemas/ImageOpsApiWorkflow'
        journeyId:
          type: string
          description: Must match the journeyId path parameter.
        sourceAssetId:
          type: string
          description: >
            Source image asset id. Required for Upscale, RemoveBackground, and
            Layer source. Optional for Prompt RegenerateImage when `stageId` is
            set (stage retry with no asset yet). Provide `imageLocation` instead
            when bypassing the asset table.
        destinationAssetId:
          type: string
          format: uuid
          description: >
            Optional correlation id for async results. If omitted, the server
            assigns a UUID and returns it on the 202 Accepted body.
        expirationTime:
          type: string
          format: date-time
          description: Optional client expiry; server clamps to at most ~300s from receipt.
        imageLocation:
          $ref: '#/components/schemas/ImageLocation'
          description: Optional override; otherwise resolved from sourceAssetId server-side.
        generationId:
          type: string
    ImageOpsLayerRequest:
      allOf:
        - $ref: '#/components/schemas/ImageOpsRequestBase'
        - type: object
          required:
            - source
            - layerId
          properties:
            source:
              type: string
              enum: [ Layer ]
            layerId:
              type: string
              minLength: 1
            promptId:
              type: string
              nullable: true
            planId:
              type: string
              nullable: true
    ImageOpsPromptRequest:
      allOf:
        - $ref: '#/components/schemas/ImageOpsRequestBase'
        - type: object
          required:
            - source
            - promptId
            - planId
          properties:
            source:
              type: string
              enum: [ Prompt ]
            promptId:
              type: string
              minLength: 1
            planId:
              type: string
              minLength: 1
            layerId:
              type: string
              nullable: true
            stageId:
              type: string
              minLength: 1
              description: >
                Plan stage id for Prompt-source retries (e.g. regenerate after a
                failed image in stage review). Included in FIFO deduplication
                when present.
    ImageOpsLegacyRequest:
      allOf:
        - $ref: '#/components/schemas/ImageOpsRequestBase'
        - type: object
          required:
            - source
            - promptId
            - sourceAssetId
          properties:
            source:
              type: string
              enum: [ Legacy ]
            promptId:
              type: string
              minLength: 1
              description: >
                design-v2 prompt. sourceAssetId must be one entry from
                response.generatedImageIds (required when the prompt has
                multiple generated images).
            workflow:
              type: string
              enum:
                - Upscale
                - RemoveBackground
            sourceAssetId:
              type: string
              minLength: 1
              description: >
                Asset id of the specific generated image to transform. When
                generatedImageIds has multiple entries, this must be the id of
                the image the user selected.
            imageLocation:
              nullable: true
              description: Must be null or omitted; pixels are resolved from sourceAssetId
                only.
            layerId:
              type: string
              nullable: true
            planId:
              type: string
              nullable: true
            stageId:
              type: string
              nullable: true
          description: >
            design-v2 chat prompt image ops (upscale / remove background).
            RegenerateImage is not supported. Completion is published as
            prompt.legacy.* on the event bus.
    ImageOpsRequest:
      oneOf:
        - $ref: '#/components/schemas/ImageOpsLayerRequest'
        - $ref: '#/components/schemas/ImageOpsPromptRequest'
        - $ref: '#/components/schemas/ImageOpsLegacyRequest'
      discriminator:
        propertyName: source
        mapping:
          Layer: '#/components/schemas/ImageOpsLayerRequest'
          Prompt: '#/components/schemas/ImageOpsPromptRequest'
          Legacy: '#/components/schemas/ImageOpsLegacyRequest'
    ImageOpsAcceptedResponse:
      type: object
      properties:
        journeyId:
          type: string
        workflow:
          $ref: '#/components/schemas/ImageOpsApiWorkflow'
        source:
          type: string
          enum: [ Layer, Prompt, Legacy ]
        layerId:
          type: string
        promptId:
          type: string
        planId:
          type: string
        sourceAssetId:
          type: string
        destinationAssetId:
          type: string
          format: uuid
          description: Correlation id for async result handlers (matches submission).
        expirationTime:
          type: string
          format: date-time
