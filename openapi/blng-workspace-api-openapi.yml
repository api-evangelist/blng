openapi: 3.2.0
info:
  title: User Workspace API
  description: Api to manage roles and permissions of users
  version: 1.0.0
tags:
- name: Workspace
paths:
  /users/{userId}/memberships:
    get:
      tags:
      - Workspace
      summary: List workspace memberships for user (multi-tenancy; returns [] when feature off)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success (empty array when multi-tenancy is disabled for the stage)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMembership'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdMemberships
      x-operation-id-source: derived
  /users/{userId}/workspaces:
    get:
      tags:
      - Workspace
      summary: List workspaces for user (summaries for switcher; returns [] when feature off)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success (empty array when multi-tenancy is disabled for the stage)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspaces
      x-operation-id-source: derived
    post:
      tags:
      - Workspace
      summary: Create a team or enterprise workspace (creator becomes owner)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, deleted account, insufficient access to parent enterprise, or workspace creation limit reached (soft cap on memberships with role owner; configurable per stage and per user via `allowedWorkspaces` on the User record).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or parent workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: postUsersByUserIdWorkspaces
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}:
    get:
      tags:
      - Workspace
      summary: Get a single workspace (for user) by workspaceId
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspacesByWorkspaceId
      x-operation-id-source: derived
    put:
      tags:
      - Workspace
      summary: Update editable workspace settings fields (name, picture); OWNER/ADMIN only
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWorkspaceSwitcherItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role for update, allowGuestCompanySkills set to true on a workspace that is not Enterprise, or allowGuestCompanySkills sent by an external member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user (or workspace row missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: allowGuestCompanySkills was sent and another request changed its stored value between the read and the write, or turning it on found the workspace no longer Enterprise. Nothing was written; read the settings again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: putUsersByUserIdWorkspacesByWorkspaceId
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/members:
    get:
      tags:
      - Workspace
      summary: List members for a workspace visible to the requesting user (paginated)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        description: Page size (default 50, max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: nextToken
        in: query
        required: false
        description: Opaque token from the previous response to fetch the next page
        schema:
          type: string
      responses:
        '200':
          description: Success (members empty when multi-tenancy is disabled for the stage). `email` and `displayName` use denormalized fields on membership when present to avoid per-page Users BatchGet; legacy rows without those fields are hydrated from Users for that page only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembersList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspacesByWorkspaceIdMembers
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/invitations:
    get:
      tags:
      - Workspace
      summary: List pending workspace invitations (owner/admin)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pending invitations for the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspacePendingInvitationAdmin'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspacesByWorkspaceIdInvitations
      x-operation-id-source: derived
    post:
      tags:
      - Workspace
      summary: Invite a member by email (team, enterprise only; owner/admin; only owners…
      description: Only an OWNER may assign OWNER or BILLING_ADMIN; an ADMIN may assign ADMIN, EDITOR and VIEWER (403 otherwise). The requester's role is re-checked atomically with the invitation write, so a requester demoted or removed mid-request gets the same 403/404 as if the change had landed first.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationCreated'
        '400':
          description: Bad Request (e.g. invalid body or cannot invite your own email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, role not assignable by the requester (an ADMIN inviting OWNER or BILLING_ADMIN), or workspace type does not support invitations (personal starter/pro/beta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or authenticated user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pending invite exists, user already a member, or the requester's membership changed while the request was in flight (retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: postUsersByUserIdWorkspacesByWorkspaceIdInvitations
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/invitations/{invitationId}:
    delete:
      tags:
      - Workspace
      summary: Revoke a pending workspace invitation (owner/admin)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Invitation revoked
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invitation is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: deleteUsersByUserIdWorkspacesByWorkspaceIdInvitationsByInvitationId
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/invitations/{invitationId}/resend:
    post:
      tags:
      - Workspace
      summary: Resend workspace invite email (team/ent workspaces only; owner/admin; SES)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Resend attempted
          content:
            application/json:
              schema:
                type: object
                required:
                - emailSent
                properties:
                  emailSent:
                    type: boolean
                    description: Whether SES accepted the send (false if misconfigured or SES failure)
        '400':
          description: Bad Request (e.g. invitation not pending, expired, or DESIGN_APP_WEB_ORIGIN missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, or workspace type does not support invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many resend attempts for this invitation (cooldown between successful invitation emails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: postUsersByUserIdWorkspacesByWorkspaceIdInvitationsByInvitationIdResend
      x-operation-id-source: derived
  /users/{userId}/workspace-invitations/inbox:
    get:
      tags:
      - Workspace
      summary: List pending workspace invitations for the signed-in user's email (accept from…
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pending invitations the user can accept (non-expired, workspace still valid, not already a member)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - workspaceInvitationId
                  - workspaceId
                  - workspaceName
                  - role
                  - createdAt
                  properties:
                    workspaceInvitationId:
                      type: string
                      format: uuid
                    workspaceId:
                      type: string
                      format: uuid
                    workspaceName:
                      type: string
                    role:
                      type: string
                    createdAt:
                      type: string
                    expiresAt:
                      type: integer
                      description: Unix epoch seconds when the invite link expires
        '403':
          description: Multi-tenancy disabled or account not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspaceInvitationsInbox
      x-operation-id-source: derived
  /users/{userId}/workspace-invitations/{invitationId}/email-match:
    get:
      tags:
      - Workspace
      summary: Check whether the signed-in user's email matches a pending workspace…
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Match result
          content:
            application/json:
              schema:
                type: object
                required:
                - matches
                properties:
                  matches:
                    type: boolean
                  workspaceName:
                    type: string
                    description: Present only when matches is true; workspace display name for the invite UI
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Path userId does not match authenticated user or multi-tenancy disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User, invitation not found, or invitation not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspaceInvitationsByInvitationIdEmailMatch
      x-operation-id-source: derived
  /users/{userId}/workspace-invitations/{invitationId}/accept:
    post:
      tags:
      - Workspace
      summary: Accept a workspace invitation (authenticated; email must match; target must be…
      description: The inviter is re-validated at acceptance. The invitation is refused (409) when the inviter is no longer an active OWNER or ADMIN, or when the inviter's current role can no longer grant the invited role. An OWNER or BILLING_ADMIN invitation sent by an ADMIN is refused this way; an OWNER has to invite again. The inviter check is part of the acceptance transaction, so an inviter demoted or removed mid-request also gets this 409 rather than a grant.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email mismatch, multi-tenancy disabled, orphaned account, or target workspace does not support members (personal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invitation not pending, expired, already a member, invalid role, inviter can no longer invite or can no longer grant the invited role, or transactional conflict (e.g. accepted concurrently in another session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DynamoDB throughput limit; client should retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: postUsersByUserIdWorkspaceInvitationsByInvitationIdAccept
      x-operation-id-source: derived
  /workspace-invitations/{invitationId}:
    get:
      tags:
      - Workspace
      summary: Public invitation metadata for the invite landing page (no auth; workspace name…
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationPublic'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy is not enabled for this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getWorkspaceInvitationsByInvitationId
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/members/{memberUserId}:
    put:
      tags:
      - Workspace
      summary: Update a member role (owner/admin; only owners assign or change OWNER and…
      description: Only an OWNER may assign OWNER or BILLING_ADMIN; an ADMIN may assign ADMIN, EDITOR and VIEWER (403 otherwise). An ADMIN also cannot change the role of a member who is currently OWNER or BILLING_ADMIN. The write re-checks the requester's role and the member's current role atomically, so a change to either while the request is in flight returns the refusal that applies to the new state (403/404/409), not a 200.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberUserId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRoleRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, or an ADMIN assigning OWNER or BILLING_ADMIN or changing an OWNER or BILLING_ADMIN member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or member not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Would remove the last workspace owner, the member is deactivated, or a membership changed while the request was in flight (retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: putUsersByUserIdWorkspacesByWorkspaceIdMembersByMemberUserId
      x-operation-id-source: derived
    delete:
      tags:
      - Workspace
      summary: Remove a workspace member (owner/admin; only owners remove OWNER and…
      description: An ADMIN may remove ADMIN, EDITOR and VIEWER members. Only an OWNER may remove an OWNER or BILLING_ADMIN member (403 otherwise). The removal re-checks the requester's role and the member's current role atomically, so a change to either while the request is in flight returns the refusal that applies to the new state.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Member removed
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled, insufficient role, or an ADMIN removing an OWNER or BILLING_ADMIN member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or member not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot remove the last workspace owner, or a membership changed while the request was in flight (retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: deleteUsersByUserIdWorkspacesByWorkspaceIdMembersByMemberUserId
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/settings:
    get:
      tags:
      - Workspace
      summary: Per-workspace settings read model (settings + caller role/permissions)
      description: Readable by every active member of the workspace; the derived permissions tell the client which settings surfaces to render. Mutations remain role-gated on their own endpoints.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user (also returned while multi-tenancy is disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspacesByWorkspaceIdSettings
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/integrity:
    get:
      tags:
      - Workspace
      summary: Workspace integrity summary (owner/admin; reporting only)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Integrity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceIntegrityReport'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: getUsersByUserIdWorkspacesByWorkspaceIdIntegrity
      x-operation-id-source: derived
  /users/{userId}/workspaces/{workspaceId}/sso-config:
    put:
      tags:
      - Workspace
      summary: Rotate the workspace's enterprise SAML config (owner/admin; self-service)
      description: Updates the SAML IdP metadata (and optionally the email attribute mapping) for the provider the caller's workspace federates through. The provider is resolved only from the caller's own membership, never the request body.
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadataXml
              properties:
                metadataXml:
                  type: string
                  description: Inline SAML IdP metadata document (EntityDescriptor XML), not a URL.
                emailAttribute:
                  type: string
                  description: Optional SAML assertion attribute carrying email; omitted keeps the current mapping.
      responses:
        '200':
          description: SSO configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  providerName:
                    type: string
                  updated:
                    type: boolean
        '400':
          description: Invalid body, no provider for workspace, or metadata rejected by Cognito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy disabled or insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or enterprise SSO provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
      operationId: putUsersByUserIdWorkspacesByWorkspaceIdSsoConfig
      x-operation-id-source: derived
  /users/{userId}/active-workspace:
    put:
      tags:
      - Workspace
      summary: Set active workspace (403 when multi-tenancy disabled for stage)
      security:
      - cognitoUserAuth:
        - openid
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveWorkspaceRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Multi-tenancy not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found, or no membership for the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: putUsersByUserIdActiveWorkspace
      x-operation-id-source: derived
components:
  schemas:
    WorkspacePendingInvitationAdmin:
      type: object
      required:
      - workspaceInvitationId
      - workspaceId
      - email
      - role
      - status
      - inviteTarget
      - createdAt
      - updatedAt
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
        inviteTarget:
          type: string
          enum:
          - new_user
          - existing_user
        createdAt:
          type: string
        updatedAt:
          type: string
    WorkspaceIntegrityReport:
      type: object
      required:
      - workspaceId
      - workspaceRowExists
      - memberCount
      - ownerCount
      properties:
        workspaceId:
          type: string
          format: uuid
        workspaceRowExists:
          type: boolean
          description: Whether a workspace row exists for this id (false may indicate orphaned memberships)
        memberCount:
          type: integer
          minimum: 0
        ownerCount:
          type: integer
          minimum: 0
        subscriptionIdOnWorkspace:
          type: string
          description: Present when the workspace row exists and has subscriptionId set
    WorkspacePolicies:
      type: object
      description: 'The workspace policies, per-customer restrictions an operator sets in the management console, delivered in the same item as entitlements: a key is present only once an operator set it, and an empty object means nothing is set (or the workspace record was not found). Unknown keys and values that are not booleans are dropped. The client applies each policy''s meaning for an absent key. Not settable through PUT /users/{userId}/workspaces/{workspaceId}, which rejects the field.'
      properties:
        v3ui:
          type: boolean
          description: The v3 UI (the enterprise Spaces IA). On only when true on an enterprise workspace; absent means off.
        voiceInput:
          type: boolean
          description: Voice dictation. Off only when false, when the voice gateway refuses the dictation socket; absent means on.
    MarketingConsentReceipt:
      type: object
      description: Marketing opt-in receipt (GDPR consent provenance). Present only for users who made an explicit choice; optIn records that choice either way. Synced to HubSpot as the marketing_opt_in contact property. Absent for users who have never been asked or who dismissed the prompt.
      required:
      - optIn
      - timestamp
      - wordingVersion
      - captureLocation
      properties:
        optIn:
          type: boolean
          description: The user's choice
        timestamp:
          type: string
          format: date-time
          description: When the choice was captured. Server-stamped; never accepted from the caller.
        wordingVersion:
          type: string
          description: Version tag of the exact consent wording shown, so the receipt survives copy changes
        captureLocation:
          type: string
          description: Which surface captured the choice. `email-unsubscribe` and `email-spam-complaint` are withdrawals the recipient made against mail we sent, the first through an unsubscribe link and the second by reporting it to their provider. Both are recorded from the CRM's own subscription-change events rather than through this API.
          enum:
          - signup
          - first-login-prompt
          - settings
          - contact-sales
          - email-unsubscribe
          - email-spam-complaint
    WorkspaceMembersList:
      type: object
      required:
      - members
      description: Paginated list from GET .../workspaces/{workspaceId}/members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMembership'
        nextToken:
          type: string
          description: Present when more pages exist; pass as the nextToken query parameter
    UserWorkspaceSwitcherItem:
      type: object
      description: Per-membership workspace summary for the UI switcher. Returned by GET /users/{userId}/workspaces. Hydrated fields (name, type, etc.) may be omitted if the workspace row is missing.
      required:
      - workspaceId
      - role
      - workspacePolicies
      properties:
        workspaceId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - BILLING_ADMIN
          - ADMIN
          - EDITOR
          - VIEWER
        memberType:
          type: string
          enum:
          - sso_employee
          - external
          - federated_b2b2c
        federatedIdpId:
          type: string
        name:
          type: string
          description: Workspace display name when the workspace record was found
        picture:
          type: string
          format: uuid
          description: Workspace photo asset id; absent until an owner/admin sets one
        type:
          type: string
          enum:
          - starter
          - pro
          - team
          - enterprise
          - beta
          - enterprise-team
        subscriptionId:
          type: string
          format: uuid
        subscriptionType:
          type: string
          description: Billing tier of the workspace's subscription, so the client can reflect the active workspace's plan.
          enum:
          - starter
          - pro
          - team
          - enterprise
          - beta
        subscriptionTypeInForce:
          type: string
          description: 'The plan the workspace''s subscription puts in force now: a canceled or lapsed pro, team or enterprise subscription reads starter, beta stays beta. Same rule as the subscriptionType of GET /internal/workspaces/{workspaceId}/status. Absent when the subscription row was not found or its type is unknown.'
          enum:
          - starter
          - pro
          - team
          - enterprise
          - beta
        status:
          type: string
          description: Status of the workspace's subscription. Maps to stripe status.
          enum:
          - active
          - canceled
          - incomplete
          - incomplete_expired
          - paused
          - past_due
          - trialing
          - unpaid
        entitlements:
          allOf:
          - $ref: '#/components/schemas/Entitlements'
          description: Server-computed entitlements of the workspace's subscription (tier, lapse rules and operator overrides applied). Present when the subscription row was found. Read this for the active workspace instead of re-deriving from subscriptionType.
        parentWorkspaceId:
          type: string
          format: uuid
        workspacePolicies:
          $ref: '#/components/schemas/WorkspacePolicies'
        v3ui:
          type: boolean
          deprecated: true
          description: Deprecated, read workspacePolicies.v3ui with the workspace type. True when workspacePolicies.v3ui is true on an enterprise workspace; emitted for one release while clients move to workspacePolicies.
    WorkspaceInvitationCreated:
      type: object
      required:
      - workspaceInvitationId
      - workspaceId
      - email
      - inviteTarget
      - role
      - status
      - createdAt
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
        inviteTarget:
          type: string
          enum:
          - new_user
          - existing_user
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        emailSent:
          type: boolean
          description: Whether the invite email was sent via SES (false if EMAIL_API/origin missing or send failed)
        inviteUrl:
          type: string
          format: uri
          description: Canonical accept link (DESIGN_APP_WEB_ORIGIN + /workspace-invite/{id}); present when origin is configured so clients need not use window.location
    UpdateWorkspaceRequest:
      type: object
      description: Partial update; at least one property must be present. Unknown properties are rejected.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Workspace display name
        picture:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Workspace photo asset id (a UUID from our own asset upload, same as the user avatar). URLs and data: URIs are rejected. Send null to remove the photo.'
        allowGuestCompanySkills:
          type: boolean
          description: '"Let guests use company skills". OWNER/ADMIN only, and never an external member (403). Setting it to true needs an Enterprise workspace (403 on any other type); false is accepted on any tier so a stale value can be cleared. Unlocks company skills for guests (external members); never company memory.'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    CreateWorkspaceInvitationRequest:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          description: OWNER and BILLING_ADMIN are owner-only; an ADMIN inviter may invite ADMIN, EDITOR or VIEWER.
          enum:
          - OWNER
          - BILLING_ADMIN
          - ADMIN
          - EDITOR
          - VIEWER
    WorkspaceSettingsResponse:
      type: object
      description: Per-workspace settings read model returned by GET /users/{userId}/workspaces/{workspaceId}/settings. One call returns the workspace profile, subscription linkage, the caller's own membership, and the capabilities derived from it, so a workspace-scoped settings surface renders without re-encoding the role matrix client-side.
      required:
      - workspace
      - subscription
      - caller
      - permissions
      properties:
        workspace:
          type: object
          description: Read from the raw workspace row; any field that is missing or not in canonical form (legacy or out-of-band rows) is omitted rather than failing the request.
          required:
          - workspaceId
          - allowGuestCompanySkills
          properties:
            workspaceId:
              type: string
              format: uuid
            name:
              type: string
            picture:
              type: string
              format: uuid
              description: Workspace photo asset id; absent until an owner/admin sets one
            type:
              type: string
              enum:
              - starter
              - pro
              - team
              - enterprise
              - beta
              - enterprise-team
            parentWorkspaceId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            allowGuestCompanySkills:
              type: boolean
              description: 'Effective "Let guests use company skills": true only on an Enterprise workspace whose row stores true; false otherwise, including when never set.'
        subscription:
          type: object
          properties:
            subscriptionId:
              type: string
              format: uuid
            subscriptionType:
              type: string
              enum:
              - starter
              - pro
              - team
              - enterprise
              - beta
            status:
              type: string
              enum:
              - active
              - canceled
              - incomplete
              - incomplete_expired
              - paused
              - past_due
              - trialing
              - unpaid
        caller:
          type: object
          required:
          - role
          properties:
            role:
              type: string
              enum:
              - OWNER
              - BILLING_ADMIN
              - ADMIN
              - EDITOR
              - VIEWER
            memberType:
              type: string
              enum:
              - sso_employee
              - external
              - federated_b2b2c
            federatedIdpId:
              type: string
        permissions:
          type: object
          description: Capabilities derived server-side from the caller's role on this workspace.
          required:
          - canEditWorkspaceProfile
          - canManageMembers
          - canManageBilling
          - canManageSso
          - canManageGuestCompanySkills
          properties:
            canEditWorkspaceProfile:
              type: boolean
              description: Rename / photo (OWNER, ADMIN)
            canManageMembers:
              type: boolean
              description: Invite, change roles, remove members (OWNER, ADMIN)
            canManageBilling:
              type: boolean
              description: Plan / payment mutations (OWNER, BILLING_ADMIN)
            canManageSso:
              type: boolean
              description: Rotate SAML config (OWNER/ADMIN on a federated workspace)
            canManageGuestCompanySkills:
              type: boolean
              description: Toggle allowGuestCompanySkills (OWNER/ADMIN, never an external member) on an Enterprise workspace, or turn off a stale true on a workspace that left Enterprise
    Entitlements:
      type: object
      properties:
        maxJourneys:
          type: integer
          description: Maximum number of journeys allowed on a subscription. -1 for unlimited.
        chatVisibilityWindowHrs:
          type: integer
          description: Maximum number of hours to let a user look back in chat history. -1 for unlimited.
        upscaleAvailable:
          type: boolean
          description: Whether 4k upscale is available on this subscription.
        exportWatermarkRequired:
          type: boolean
          description: Whether exports from this subscription must carry a visible "Made with BLNG" mark. The server computes the policy; whoever hands pixels out applies it, which today is the web and iOS clients at their export paths. Until the watermark launches (the runtime switch /design-app/<stage>/billing/export-watermark-enabled), this is false for every tier; once it is on, it is true for the Free tier and false for paid plans. An operator override on the subscription (entitlementOverrides.exportWatermarkRequired) wins over both.
    SetActiveWorkspaceRequest:
      type: object
      required:
      - activeWorkspaceId
      properties:
        activeWorkspaceId:
          type:
          - string
          - 'null'
          format: uuid
          description: Workspace to activate for the user; null clears active workspace.
    UpdateMembershipRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          description: OWNER and BILLING_ADMIN are owner-only; an ADMIN requester may set ADMIN, EDITOR or VIEWER.
          enum:
          - OWNER
          - BILLING_ADMIN
          - ADMIN
          - EDITOR
          - VIEWER
    WorkspaceMembership:
      type: object
      description: Membership row (PK userId, SK workspaceId). Returned by GET /users/{userId}/memberships.
      required:
      - userId
      - workspaceId
      - role
      - createdAt
      - updatedAt
      properties:
        userId:
          type: string
        workspaceId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - BILLING_ADMIN
          - ADMIN
          - EDITOR
          - VIEWER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberType:
          type: string
          enum:
          - sso_employee
          - external
          - federated_b2b2c
          description: Optional; SSO / external / federated classification
        federatedIdpId:
          type: string
          description: Optional; IdP identifier when memberType is federated_b2b2c
        email:
          type: string
          description: Optional; from Users table when returned by GET .../workspaces/{workspaceId}/members
        displayName:
          type: string
          description: Optional; derived from user first/last name when available
    CreateWorkspaceRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name for the new workspace
        type:
          type: string
          enum:
          - team
          - enterprise
    WorkspaceInvitationPublic:
      type: object
      required:
      - workspaceInvitationId
      - workspaceId
      - emailMasked
      - inviteTarget
      - status
      - role
      properties:
        workspaceInvitationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        emailMasked:
          type: string
          description: Redacted invitee email for display; use GET .../email-match when authenticated to verify the signed-in account
        inviteTarget:
          type: string
          enum:
          - new_user
          - existing_user
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
        role:
          type: string
    User:
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier for the user
        email:
          type: string
          description: Email of the user
        firstName:
          type: string
          description: First name of the user
        lastName:
          type: string
          description: Last name of the user
        companyName:
          type: string
          description: Optional company name (app metadata, not auth)
        profilePictureUrl:
          type: string
          description: Profile image URL (e.g. from federated IdP), synced on login
        stripeCustomerId:
          type: string
          description: Stripe customer ID
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the user was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to user
        welcomeEmailSent:
          type: boolean
          description: Whether the welcome email has been sent
          deprecated: true
        welcomeEmailStatus:
          type: string
          enum:
          - SENT
          - NOT_SENT
          - IN_PROGRESS
          description: Status of the welcome email
        welcomeEmailSentAt:
          type: string
          format: date-time
          description: When the consumer welcome email was actually sent. Server-written only, set by a real send (never by a client update, and not for federated users, who are created with welcomeEmailStatus SENT without an email). Absent for accounts created before Sep 27, 2026.
          readOnly: true
        tooltipFlowIdsViewed:
          type: array
          items:
            type: string
          description: Id of all tooltip flows marked as viewed
        activeWorkspaceId:
          type: string
          format: uuid
          description: Current workspace context (multi-tenancy); set via PUT /users/{userId}/active-workspace
        allowedWorkspaces:
          type: integer
          minimum: 1
          description: 'Ops-only override (DynamoDB): max workspaces this user may own via POST /users/{userId}/workspaces. Omitted on normal users; overrides the stage default (typically 3). Not settable via public PUT /users.'
        marketingConsent:
          $ref: '#/components/schemas/MarketingConsentReceipt'
        marketingConsentPromptedAt:
          type: string
          format: date-time
          description: Set when the one-time consent prompt was shown and closed without an answer. Suppresses further prompting without recording a choice the user never made. Mutually exclusive with marketingConsent. Set via PUT /users/{userId}/marketing-consent.
        signUpPending:
          type: boolean
          enum:
          - true
          description: Present only while an account is still going through sign-up and has not resolved the marketing consent ask. Written by account creation, cleared by the first consent write, and absent on every row created before it was introduced. Not settable via any API.
  securitySchemes:
    cognitoUserAuth:
      type: oauth2
      description: Cognito authorization code flow for users
      flows:
        implicit:
          authorizationUrl: https://auth.app.blng.ai/oauth2/authorize
          scopes:
            email: email
            profile: profile
            openid: openid
            aws.cognito.signin.user.admin: aws.cognito.signin.user.admin
    machineBearerToken:
      type: http
      description: 'Cognito authorization code flow for billing token, request token with command like `curl -X POST https://auth.app.blng.ai/oauth2/token -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=client_credentials&client_id=7arq76lejqmgq3qc556vr7rupn&client_secret=CLIENT_SECRET&scope=blng/billing"`

        '
      scheme: bearer
      bearerFormat: JWT Access Token
