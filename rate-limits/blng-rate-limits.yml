note: >-
  BLNG publishes no rate-limit documentation and no developer program, so there is no numeric
  requests-per-window limit to record. What IS specified, in the specs themselves, is a per-user
  CONCURRENCY limit on generation and a per-invitation resend cooldown, both surfaced as HTTP 429 with
  a JSON body. No RateLimit-*, X-RateLimit-* or Retry-After response header is declared anywhere in the
  three specs, so a client has no runtime signal to back off on beyond the status code and the code
  string in the body. The only published consumption limits are plan quotas (files, history retention),
  which are recorded in plans/blng-plans-pricing.yml, not here.
